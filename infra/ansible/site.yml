---
- name: Harden the Minos Mikr.us production host
  hosts: minos-production
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  vars:
    docker_engine_version: 5:29.8.1-1~ubuntu.24.04~noble
    docker_containerd_version: 2.3.5-1~ubuntu.24.04~noble
    docker_compose_version: 5.5.1-1~ubuntu.24.04~noble
    docker_conflicting_packages:
      - containerd
      - docker-buildx
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - docker.io
      - podman-docker
      - runc
    docker_packages:
      - "containerd.io={{ docker_containerd_version }}"
      - "docker-ce={{ docker_engine_version }}"
      - "docker-ce-cli={{ docker_engine_version }}"
      - "docker-compose-plugin={{ docker_compose_version }}"
    watcher_uid: 10001
    watcher_gid: 10001
    watcher_secrets_gid: 10002
    uptime_kuma_uid: 10003
    uptime_kuma_gid: 10003
    uptime_kuma_image_reference: docker.io/louislam/uptime-kuma@sha256:8bdad438d293e998fd7d45004cefb3baea0f96d3bc774502bba99c17d616e1f6
    uptime_kuma_public_status_enabled: false
    watcher_uptime_kuma_required: false
    watcher_nfz_activation_enabled: false
    watcher_image_repository: ghcr.io/krzysztofbury/minos-health-watcher
    cloudflared_credential_path: "/etc/minos/cloudflared/{{ cloudflared_tunnel_id }}.json"

  pre_tasks:
    - name: Require exact watcher deployment inputs
      ansible.builtin.assert:
        that:
          - watcher_uid == 10001
          - watcher_gid == 10001
          - watcher_secrets_gid == 10002
          - uptime_kuma_uid == 10003
          - uptime_kuma_gid == 10003
          - >-
            uptime_kuma_image_reference ==
            'docker.io/louislam/uptime-kuma@sha256:8bdad438d293e998fd7d45004cefb3baea0f96d3bc774502bba99c17d616e1f6'
          - uptime_kuma_public_status_enabled is boolean
          - watcher_uptime_kuma_required is boolean
          - watcher_nfz_activation_enabled is boolean
          - (not watcher_nfz_activation_enabled) or watcher_uptime_kuma_required
          - >-
            (not uptime_kuma_public_status_enabled) or
            watcher_uptime_kuma_required
          - watcher_archive_backend is defined
          - watcher_s3_bucket is defined
          - watcher_s3_endpoint is defined
          - watcher_expected_image_digest is defined
          - watcher_source_revision is defined
          - expected_hostname is defined
          - cloudflared_tunnel_id is defined
          - >-
            watcher_image_repository ==
            'ghcr.io/krzysztofbury/minos-health-watcher'
          - >-
            watcher_expected_image_digest | default('') is
            match('^sha256:[a-f0-9]{64}$')
          - >-
            watcher_source_revision | default('') is match('^[a-f0-9]{40}$')
          - watcher_archive_backend | default('') == 's3'
          - >-
            watcher_s3_bucket | default('') is
            match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
          - >-
            watcher_s3_endpoint | default('') is
            match('^https://[0-9a-f]{32}(\\.(eu|fedramp))?\\.r2\\.cloudflarestorage\\.com$')
          - >-
            expected_hostname | default('') is
            match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
          - >-
            cloudflared_tunnel_id | default('') is
            match('^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$')
          - >-
            cloudflared_credential_path ==
            '/etc/minos/cloudflared/' ~ cloudflared_tunnel_id ~ '.json'
        fail_msg: >-
          Supply the reviewed host identity, tunnel identity, S3 watcher
          settings, expected image digest, source revision, and AWS region.

    - name: Require the reviewed production host
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_release == "noble"
          - ansible_facts.distribution_version is match("^24\\.04(\\.|$)")
          - ansible_facts.virtualization_type == "lxc"
          - ansible_facts.user_id == "root"
          - ansible_facts.hostname == expected_hostname
        fail_msg: Refusing to apply the Mikr.us baseline to an unexpected host.

    - name: Use the reviewed digest while rendering in check mode
      ansible.builtin.set_fact:
        watcher_runtime_image_digest: "{{ watcher_expected_image_digest }}"
      when: ansible_check_mode

    - name: Inspect the existing tunnel credential before mutating the host
      ansible.builtin.stat:
        path: "{{ cloudflared_credential_path }}"
      register: cloudflared_credential_preflight
      when: not ansible_check_mode

    - name: Inspect the supplied tunnel credential before mutating the host
      ansible.builtin.stat:
        path: "{{ cloudflared_credentials_source }}"
      delegate_to: localhost
      register: cloudflared_credential_source_preflight
      when:
        - not ansible_check_mode
        - cloudflared_credentials_source is defined

    - name: Require a recoverable tunnel credential before mutating the host
      ansible.builtin.assert:
        that:
          - >-
            (not cloudflared_credential_preflight.stat.exists) or
            (cloudflared_credential_preflight.stat.isreg and
             cloudflared_credential_preflight.stat.pw_name == 'root' and
             cloudflared_credential_preflight.stat.gr_name == 'minos-cloudflared' and
             cloudflared_credential_preflight.stat.mode == '0440' and
             cloudflared_credential_preflight.stat.size in range(64, 4097))
          - >-
            (cloudflared_credentials_source is not defined) or
            (cloudflared_credential_source_preflight.stat.exists and
             cloudflared_credential_source_preflight.stat.isreg and
             cloudflared_credential_source_preflight.stat.mode in ['0400', '0600'] and
             cloudflared_credential_source_preflight.stat.size in range(64, 4097))
          - >-
            cloudflared_credential_preflight.stat.exists or
            cloudflared_credentials_source is defined
        fail_msg: Supply one bounded, recoverable tunnel credential with reviewed modes.
      when: not ansible_check_mode

    - name: Read the existing tunnel credential before mutating the host
      ansible.builtin.slurp:
        src: "{{ cloudflared_credential_path }}"
      register: cloudflared_credential_remote_payload
      when:
        - not ansible_check_mode
        - cloudflared_credentials_source is not defined
      no_log: true

    - name: Read the supplied tunnel credential before mutating the host
      ansible.builtin.slurp:
        src: "{{ cloudflared_credentials_source }}"
      delegate_to: localhost
      register: cloudflared_credential_source_payload
      when:
        - not ansible_check_mode
        - cloudflared_credentials_source is defined
      no_log: true

    - name: Decode the bounded tunnel credential candidate
      ansible.builtin.set_fact:
        cloudflared_credential_candidate_payload: >-
          {{
            ((cloudflared_credential_source_payload.content
              if cloudflared_credentials_source is defined
              else cloudflared_credential_remote_payload.content)
            | b64decode)
          }}
      when: not ansible_check_mode
      no_log: true

    - name: Parse the bounded tunnel credential candidate
      ansible.builtin.set_fact:
        cloudflared_credential_candidate_document: >-
          {{ cloudflared_credential_candidate_payload | from_json }}
      when: not ansible_check_mode
      no_log: true

    - name: Require the reviewed tunnel credential before mutating the host
      ansible.builtin.assert:
        that:
          - cloudflared_credential_candidate_payload | length in range(64, 4097)
          - cloudflared_credential_candidate_document is mapping
          - >-
            ['AccountTag', 'TunnelID', 'TunnelSecret'] |
            difference(cloudflared_credential_candidate_document.keys() | list) | length == 0
          - >-
            cloudflared_credential_candidate_document.keys() | list |
            difference(['AccountTag', 'Endpoint', 'TunnelID', 'TunnelSecret']) | length == 0
          - cloudflared_credential_candidate_document.TunnelID == cloudflared_tunnel_id
          - cloudflared_credential_candidate_document.AccountTag is string
          - cloudflared_credential_candidate_document.AccountTag is match('^[A-Fa-f0-9]+$')
          - cloudflared_credential_candidate_document.AccountTag | length in range(1, 129)
          - cloudflared_credential_candidate_document.TunnelSecret is string
          - cloudflared_credential_candidate_document.TunnelSecret is match('^[A-Za-z0-9+/]+={0,2}$')
          - cloudflared_credential_candidate_document.TunnelSecret | length in range(1, 1025)
          - >-
            'Endpoint' not in cloudflared_credential_candidate_document or
            (cloudflared_credential_candidate_document.Endpoint is string and
             cloudflared_credential_candidate_document.Endpoint | length in range(0, 2049))
        fail_msg: The tunnel credential is malformed or belongs to another tunnel.
      when: not ansible_check_mode

    - name: Inspect installed AWS watcher credentials before mutating the host
      ansible.builtin.stat:
        path: /etc/minos/watcher/aws/credentials
      register: watcher_aws_credentials_preflight
      when: not ansible_check_mode
      no_log: true

    - name: Inspect supplied AWS watcher credentials before mutating the host
      ansible.builtin.stat:
        path: "{{ watcher_aws_credentials_source }}"
      delegate_to: localhost
      register: watcher_aws_credentials_source_preflight
      when:
        - not ansible_check_mode
        - watcher_aws_credentials_source is defined
      no_log: true

    - name: Require recoverable AWS watcher credentials before mutating the host
      ansible.builtin.assert:
        that:
          - >-
            (watcher_aws_credentials_preflight.stat.exists and
             watcher_aws_credentials_preflight.stat.isreg and
             watcher_aws_credentials_preflight.stat.uid == 0 and
             watcher_aws_credentials_preflight.stat.gid == watcher_secrets_gid and
             watcher_aws_credentials_preflight.stat.mode == '0440' and
             watcher_aws_credentials_preflight.stat.size in range(64, 4097)) or
            (watcher_aws_credentials_source is defined and
             watcher_aws_credentials_source_preflight.stat.exists and
             watcher_aws_credentials_source_preflight.stat.isreg and
             watcher_aws_credentials_source_preflight.stat.mode in ['0400', '0600'] and
             watcher_aws_credentials_source_preflight.stat.size in range(64, 4097))
        fail_msg: Supply bounded regular AWS watcher credentials with reviewed modes.
      when: not ansible_check_mode
      no_log: true

    - name: Read supplied AWS watcher credentials before mutating the host
      ansible.builtin.slurp:
        src: "{{ watcher_aws_credentials_source }}"
      delegate_to: localhost
      register: watcher_aws_credentials_source_payload
      when:
        - not ansible_check_mode
        - watcher_aws_credentials_source is defined
      no_log: true

    - name: Read installed AWS watcher credentials before mutating the host
      ansible.builtin.slurp:
        src: /etc/minos/watcher/aws/credentials
      register: watcher_aws_credentials_installed_payload
      when:
        - not ansible_check_mode
        - watcher_aws_credentials_source is not defined
      no_log: true

    - name: Decode the bounded AWS watcher credential candidate
      ansible.builtin.set_fact:
        watcher_aws_credentials_candidate_payload: >-
          {{
            (watcher_aws_credentials_source_payload.content
             if watcher_aws_credentials_source is defined
             else watcher_aws_credentials_installed_payload.content)
            | b64decode
          }}
      when: not ansible_check_mode
      no_log: true

    - name: Require the exact R2 watcher credential schema
      ansible.builtin.assert:
        that:
          - watcher_aws_credentials_candidate_payload | length in range(64, 4097)
          - >-
            watcher_aws_credentials_candidate_payload is match(
              '^\[default\]\naws_access_key_id[ \t]*=[ \t]*[0-9a-f]{32}\naws_secret_access_key[ \t]*=[ \t]*[0-9a-f]{64}\n?$'
            )
        fail_msg: The R2 watcher credential candidate has an invalid schema.
      when: not ansible_check_mode
      no_log: true

    - name: Inspect installed Uptime Kuma watcher targets before mutating the host
      ansible.builtin.stat:
        path: /etc/minos/watcher/uptime-kuma/targets.json
      register: watcher_uptime_kuma_targets_preflight
      when: not ansible_check_mode
      no_log: true

    - name: Inspect supplied Uptime Kuma watcher targets before mutating the host
      ansible.builtin.stat:
        path: "{{ watcher_uptime_kuma_targets_source }}"
      delegate_to: localhost
      register: watcher_uptime_kuma_targets_source_preflight
      when:
        - not ansible_check_mode
        - watcher_uptime_kuma_targets_source is defined
      no_log: true

    - name: Require recoverable Uptime Kuma watcher targets before mutating the host
      ansible.builtin.assert:
        that:
          - >-
            (not watcher_uptime_kuma_targets_preflight.stat.exists) or
            (watcher_uptime_kuma_targets_preflight.stat.isreg and
             watcher_uptime_kuma_targets_preflight.stat.uid == 0 and
             watcher_uptime_kuma_targets_preflight.stat.gid == watcher_secrets_gid and
             watcher_uptime_kuma_targets_preflight.stat.mode == '0440' and
             watcher_uptime_kuma_targets_preflight.stat.size in range(2, 65537))
          - >-
            (watcher_uptime_kuma_targets_source is not defined) or
            (watcher_uptime_kuma_targets_source_preflight.stat.exists and
             watcher_uptime_kuma_targets_source_preflight.stat.isreg and
             watcher_uptime_kuma_targets_source_preflight.stat.mode in ['0400', '0600'] and
             watcher_uptime_kuma_targets_source_preflight.stat.size in range(2, 65537))
        fail_msg: Supply bounded regular Uptime Kuma watcher targets with reviewed modes.
      when: not ansible_check_mode
      no_log: true

    - name: Read supplied Uptime Kuma watcher targets before mutating the host
      ansible.builtin.slurp:
        src: "{{ watcher_uptime_kuma_targets_source }}"
      delegate_to: localhost
      register: watcher_uptime_kuma_targets_source_payload
      when:
        - not ansible_check_mode
        - watcher_uptime_kuma_targets_source is defined
      no_log: true

    - name: Read installed Uptime Kuma watcher targets before mutating the host
      ansible.builtin.slurp:
        src: /etc/minos/watcher/uptime-kuma/targets.json
      register: watcher_uptime_kuma_targets_installed_payload
      when:
        - not ansible_check_mode
        - watcher_uptime_kuma_targets_source is not defined
        - watcher_uptime_kuma_targets_preflight.stat.exists
      no_log: true

    - name: Decode the bounded Uptime Kuma watcher target candidate
      ansible.builtin.set_fact:
        watcher_uptime_kuma_targets_candidate_payload: >-
          {{
            (watcher_uptime_kuma_targets_source_payload.content | b64decode)
            if watcher_uptime_kuma_targets_source is defined
            else ((watcher_uptime_kuma_targets_installed_payload.content | b64decode)
                  if watcher_uptime_kuma_targets_preflight.stat.exists
                  else '{"version":1,"sources":{}}')
          }}
      when: not ansible_check_mode
      no_log: true

    - name: Parse the bounded Uptime Kuma watcher target candidate
      ansible.builtin.set_fact:
        watcher_uptime_kuma_targets_candidate_document: >-
          {{ watcher_uptime_kuma_targets_candidate_payload | from_json }}
      when: not ansible_check_mode
      no_log: true

    - name: Require the exact Uptime Kuma watcher target document schema
      ansible.builtin.assert:
        that:
          - watcher_uptime_kuma_targets_candidate_payload | length in range(2, 65537)
          - watcher_uptime_kuma_targets_candidate_document is mapping
          - >-
            watcher_uptime_kuma_targets_candidate_document.keys() | list | sort ==
            ['sources', 'version']
          - watcher_uptime_kuma_targets_candidate_document.version is integer
          - watcher_uptime_kuma_targets_candidate_document.version == 1
          - watcher_uptime_kuma_targets_candidate_document.sources is mapping
          - watcher_uptime_kuma_targets_candidate_document.sources | length <= 128
          - >-
            (not watcher_uptime_kuma_required) or
            ('rsk' in watcher_uptime_kuma_targets_candidate_document.sources)
          - >-
            (not watcher_nfz_activation_enabled) or
            ('nfz' in watcher_uptime_kuma_targets_candidate_document.sources)
          - >-
            (not watcher_nfz_activation_enabled) or
            ('baw' in watcher_uptime_kuma_targets_candidate_document.sources)
        fail_msg: The Uptime Kuma watcher target candidate has an invalid schema.
      when: not ansible_check_mode
      no_log: true

    - name: Require string Uptime Kuma watcher target entries
      ansible.builtin.assert:
        that:
          - item.key is string
          - item.value is string
        fail_msg: An Uptime Kuma watcher target entry is not a string pair.
      loop: "{{ watcher_uptime_kuma_targets_candidate_document.sources | dict2items }}"
      when: not ansible_check_mode
      no_log: true

    - name: Require safe bounded Uptime Kuma watcher target entries
      ansible.builtin.assert:
        that:
          - item.key is match('^[a-z][a-z0-9_-]{0,63}$')
          - item.value is match('^[A-Za-z0-9]{32}$')
        fail_msg: An Uptime Kuma watcher source ID or push token is invalid.
      loop: "{{ watcher_uptime_kuma_targets_candidate_document.sources | dict2items }}"
      when: not ansible_check_mode
      no_log: true

    - name: Inspect the pinned Uptime Kuma data image marker
      ansible.builtin.stat:
        path: /var/lib/minos/uptime-kuma/.minos-image-reference
      register: uptime_kuma_image_marker_preflight
      when: not ansible_check_mode

    - name: Inspect existing Uptime Kuma SQLite state before pinning an image
      ansible.builtin.stat:
        path: /var/lib/minos/uptime-kuma/kuma.db
      register: uptime_kuma_database_preflight
      when: not ansible_check_mode

    - name: Refuse unversioned existing Uptime Kuma state
      ansible.builtin.assert:
        that:
          - >-
            (not uptime_kuma_database_preflight.stat.exists) or
            uptime_kuma_image_marker_preflight.stat.exists
        fail_msg: Existing Uptime Kuma data needs a reviewed pinned image marker.
      when: not ansible_check_mode

    - name: Require a bounded regular Uptime Kuma data image marker
      ansible.builtin.assert:
        that:
          - >-
            (not uptime_kuma_image_marker_preflight.stat.exists) or
            (uptime_kuma_image_marker_preflight.stat.isreg and
             uptime_kuma_image_marker_preflight.stat.uid == 0 and
             uptime_kuma_image_marker_preflight.stat.gid == uptime_kuma_gid and
             uptime_kuma_image_marker_preflight.stat.mode == '0444' and
             uptime_kuma_image_marker_preflight.stat.size in range(64, 257))
        fail_msg: The Uptime Kuma data image marker has an unsafe boundary.
      when: not ansible_check_mode

    - name: Read the pinned Uptime Kuma data image marker
      ansible.builtin.slurp:
        src: /var/lib/minos/uptime-kuma/.minos-image-reference
      register: uptime_kuma_image_marker_payload
      when:
        - not ansible_check_mode
        - uptime_kuma_image_marker_preflight.stat.exists

    - name: Refuse an Uptime Kuma image change without a stopped migration procedure
      ansible.builtin.assert:
        that:
          - >-
            (not uptime_kuma_image_marker_preflight.stat.exists) or
            ((uptime_kuma_image_marker_payload.content | b64decode | trim) ==
             uptime_kuma_image_reference)
        fail_msg: >-
          Refusing to change the Uptime Kuma image for preserved data without a
          future stopped backup and migration procedure.
      when: not ansible_check_mode

    - name: Inspect the SSH configuration for a private Kuma setup exception
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            from pathlib import Path;
            p=Path('/etc/ssh/sshd_config');
            print('present' if b'MINOS TEMP KUMA SETUP' in p.read_bytes() else 'absent')
      register: uptime_kuma_ssh_exception
      changed_when: false
      when: not ansible_check_mode

    - name: Refuse a leftover private Kuma SSH forwarding exception
      ansible.builtin.assert:
        that:
          - uptime_kuma_ssh_exception.stdout == 'absent'
        fail_msg: Remove the temporary Kuma SSH forwarding exception before deployment.
      when: not ansible_check_mode

    - name: Inspect Docker availability for private Kuma bootstrap handoff
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: uptime_kuma_bootstrap_docker
      when: not ansible_check_mode

    - name: Inspect a separately bootstrapped Uptime Kuma writer
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - label=com.docker.compose.project=minos-kuma-bootstrap
          - --filter
          - label=com.docker.compose.service=uptime-kuma
      register: uptime_kuma_bootstrap_writer
      changed_when: false
      when:
        - not ansible_check_mode
        - uptime_kuma_bootstrap_docker.stat.exists

    - name: Refuse concurrent Uptime Kuma database writers
      ansible.builtin.assert:
        that:
          - >-
            (not uptime_kuma_bootstrap_docker.stat.exists) or
            uptime_kuma_bootstrap_writer.stdout | default('') | trim == ''
        fail_msg: >-
          Stop the private Kuma bootstrap Compose project before activating the
          production Compose project against its preserved data directory.
      when: not ansible_check_mode

    - name: Verify IPv4 and IPv6 netfilter access in the LXC guest
      ansible.builtin.command:
        argv: ["{{ item }}", "-S"]
      loop:
        - iptables
        - ip6tables
      changed_when: false
      check_mode: false

    - name: Verify nftables access in the LXC guest
      ansible.builtin.command: nft list ruleset
      changed_when: false
      check_mode: false

  tasks:
    - name: Preserve the reviewed root SSH key directory
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install the reviewed root SSH key
      ansible.builtin.copy:
        src: files/root_authorized_keys
        dest: /root/.ssh/authorized_keys
        owner: root
        group: root
        mode: "0600"

    - name: Inventory installed packages before adding Docker
      ansible.builtin.package_facts:
        manager: apt

    - name: Reject packages that conflict with the official Docker distribution
      ansible.builtin.assert:
        that:
          - docker_conflicting_packages | intersect(ansible_facts.packages.keys()) | length == 0
        fail_msg: Refusing to replace an unreviewed container runtime.

    - name: Create the APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the pinned Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        checksum: sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
        owner: root
        group: root
        mode: "0644"

    - name: Configure the official Docker repository
      ansible.builtin.copy:
        src: files/docker.sources
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: "0644"

    - name: Pin the reviewed Docker package set
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/minos-docker
        owner: root
        group: root
        mode: "0644"
        content: |
          Package: docker-ce docker-ce-cli
          Pin: version {{ docker_engine_version }}
          Pin-Priority: 1001

          Package: containerd.io
          Pin: version {{ docker_containerd_version }}
          Pin-Priority: 1001

          Package: docker-compose-plugin
          Pin: version {{ docker_compose_version }}
          Pin-Priority: 1001

    - name: Refresh the APT package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Apply available package upgrades
      ansible.builtin.apt:
        upgrade: dist

    - name: Install baseline security packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - unattended-upgrades
          - ufw
        state: present

    - name: Create the Docker configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure the Docker daemon security and log boundary
      ansible.builtin.copy:
        src: files/docker-daemon.json
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      notify: Restart Docker

    - name: Install the exact Docker Engine and Compose package set
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        install_recommends: false
      when: not ansible_check_mode

    - name: Enable Docker Engine and containerd
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - containerd.service
        - docker.service
      when: not ansible_check_mode

    - name: Apply Docker configuration before verification
      ansible.builtin.meta: flush_handlers

    - name: Read the effective Docker Engine settings
      ansible.builtin.command:
        argv:
          - docker
          - info
          - --format
          - "{{ '{{.Driver}}|{{.LoggingDriver}}|{{.LiveRestoreEnabled}}|{{.DockerRootDir}}' }}"
      register: docker_effective
      changed_when: false
      when: not ansible_check_mode

    - name: Read the Docker and Compose versions
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [docker, version, --format, "{{ '{{.Server.Version}}' }}"]
        - [docker, compose, version, --short]
      register: docker_versions
      changed_when: false
      when: not ansible_check_mode

    - name: Read the installed Docker package versions
      ansible.builtin.command:
        argv:
          - dpkg-query
          - --show
          - "--showformat=${Package}=${Version}\n"
          - containerd.io
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
      register: docker_package_versions
      changed_when: false
      when: not ansible_check_mode

    - name: Inspect the Docker socket and operator group
      ansible.builtin.stat:
        path: /var/run/docker.sock
      register: docker_socket
      when: not ansible_check_mode

    - name: Read the Docker operator group
      ansible.builtin.getent:
        database: group
        key: docker
      when: not ansible_check_mode

    - name: Read the local account database
      ansible.builtin.getent:
        database: passwd
      when: not ansible_check_mode

    - name: Classify primary Docker group members
      ansible.builtin.set_fact:
        docker_primary_group_members: >-
          {{ ansible_facts.getent_passwd | dict2items
             | selectattr('value.2', 'equalto', ansible_facts.getent_group.docker[1])
             | map(attribute='key') | list }}
      when: not ansible_check_mode

    - name: Inspect TCP listeners after starting Docker
      ansible.builtin.command:
        argv: [ss, -H, -lntp]
      register: tcp_listeners_after_docker
      changed_when: false
      when: not ansible_check_mode

    - name: Require the reviewed Docker runtime boundary
      ansible.builtin.assert:
        that:
          - docker_effective.stdout.split('|')[0] in ['overlay2', 'overlayfs']
          - docker_effective.stdout.split('|')[1:] == ['local', 'true', '/var/lib/docker']
          - docker_versions.results[0].stdout == "29.8.1"
          - docker_versions.results[1].stdout == "5.5.1"
          - docker_package_versions.stdout_lines | sort == [
              'containerd.io=' + docker_containerd_version,
              'docker-ce=' + docker_engine_version,
              'docker-ce-cli=' + docker_engine_version,
              'docker-compose-plugin=' + docker_compose_version
            ] | sort
          - docker_socket.stat.exists
          - docker_socket.stat.pw_name == "root"
          - docker_socket.stat.gr_name == "docker"
          - docker_socket.stat.mode == "0660"
          - ansible_facts.getent_group.docker[2] | length == 0
          - docker_primary_group_members | length == 0
          - "'dockerd' not in tcp_listeners_after_docker.stdout"
        fail_msg: The effective Docker runtime differs from the reviewed boundary.
      when: not ansible_check_mode

    - name: Exercise the container runtime without network or host publication
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - docker.io/library/hello-world@sha256:5e23090353324d887c48ad5e5c56d294eab81588df9605b07d1afe895f9cc8f8
      register: docker_smoke_test
      changed_when: false
      failed_when: docker_smoke_test.rc != 0 or 'Hello from Docker!' not in docker_smoke_test.stdout
      when: not ansible_check_mode

    - name: Inspect the dedicated Uptime Kuma numeric identity slots
      ansible.builtin.command:
        argv: [getent, "{{ item }}", "10003"]
      loop:
        - passwd
        - group
      register: uptime_kuma_identity_slots
      changed_when: false
      failed_when: uptime_kuma_identity_slots.rc not in [0, 2]
      when: not ansible_check_mode

    - name: Reject Uptime Kuma numeric identity collisions
      ansible.builtin.assert:
        that:
          - >-
            uptime_kuma_identity_slots.results[0].rc == 2 or
            uptime_kuma_identity_slots.results[0].stdout.split(':')[0] ==
            'minos-uptime-kuma'
          - >-
            uptime_kuma_identity_slots.results[1].rc == 2 or
            uptime_kuma_identity_slots.results[1].stdout.split(':')[0] ==
            'minos-uptime-kuma'
        fail_msg: UID or GID 10003 belongs to another host identity.
      when: not ansible_check_mode

    - name: Create the cloudflared credential group
      ansible.builtin.group:
        name: minos-cloudflared
        gid: 65532
        system: true
        state: present

    - name: Create the pinned Uptime Kuma group
      ansible.builtin.group:
        name: minos-uptime-kuma
        gid: "{{ uptime_kuma_gid }}"
        system: true
        state: present

    - name: Create the pinned watcher groups
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid }}"
        system: true
        state: present
      loop:
        - {name: minos-watcher, gid: "{{ watcher_gid }}"}
        - {name: minos-watcher-secrets, gid: "{{ watcher_secrets_gid }}"}

    - name: Create the pinned watcher host identity
      ansible.builtin.user:
        name: minos-watcher
        uid: "{{ watcher_uid }}"
        group: minos-watcher
        groups: ""
        append: false
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        system: true
        state: present

    - name: Create the pinned Uptime Kuma host identity
      ansible.builtin.user:
        name: minos-uptime-kuma
        uid: "{{ uptime_kuma_uid }}"
        group: minos-uptime-kuma
        groups: ""
        append: false
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        system: true
        state: present

    - name: Read the effective Uptime Kuma host identity
      ansible.builtin.command:
        argv: [getent, "{{ item }}", minos-uptime-kuma]
      loop:
        - passwd
        - group
      register: uptime_kuma_host_identity
      changed_when: false
      when: not ansible_check_mode

    - name: Require the dedicated Uptime Kuma host identity
      ansible.builtin.assert:
        that:
          - >-
            uptime_kuma_host_identity.results[0].stdout is
            match('^minos-uptime-kuma:x:10003:10003:[^:]*:/nonexistent:/usr/sbin/nologin$')
          - >-
            uptime_kuma_host_identity.results[1].stdout ==
            'minos-uptime-kuma:x:10003:'
        fail_msg: The effective Uptime Kuma host identity is invalid.
      when: not ansible_check_mode

    - name: Read the cloudflared credential group
      ansible.builtin.getent:
        database: group
        key: minos-cloudflared
      when: not ansible_check_mode

    - name: Classify primary cloudflared group members
      ansible.builtin.set_fact:
        cloudflared_primary_group_members: >-
          {{ ansible_facts.getent_passwd | dict2items
             | selectattr('value.2', 'equalto', ansible_facts.getent_group['minos-cloudflared'][1])
             | map(attribute='key') | list }}
      when: not ansible_check_mode

    - name: Require an exclusive cloudflared credential group
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_group['minos-cloudflared'][1] == "65532"
          - ansible_facts.getent_group['minos-cloudflared'][2] | length == 0
          - cloudflared_primary_group_members | length == 0
        fail_msg: The cloudflared credential group has an unreviewed host member.
      when: not ansible_check_mode

    - name: Create the Minos runtime directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: /opt/minos, group: root, mode: "0755"}
        - {path: /opt/minos/edge, group: root, mode: "0755"}
        - {path: /opt/minos/candidate, group: root, mode: "0755"}
        - {path: /opt/minos/candidate/edge, group: root, mode: "0755"}
        - {path: /etc/minos, group: root, mode: "0750"}
        - {path: /etc/minos/cloudflared, group: minos-cloudflared, mode: "0750"}
        - {path: /etc/minos/cloudflared/candidate, group: minos-cloudflared, mode: "0750"}
        - {path: /etc/minos/watcher, group: minos-watcher-secrets, mode: "0750"}
        - {path: /etc/minos/watcher/aws, group: minos-watcher-secrets, mode: "0750"}
        - {path: /etc/minos/watcher/uptime-kuma, group: minos-watcher-secrets, mode: "0750"}
        - {path: /etc/minos/watcher/candidate, group: minos-watcher-secrets, mode: "0750"}
        - {path: /etc/minos/watcher/candidate/aws, group: minos-watcher-secrets, mode: "0750"}
        - {path: /etc/minos/watcher/candidate/uptime-kuma, group: minos-watcher-secrets, mode: "0750"}

    - name: Create secure watcher data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: minos-watcher
        group: minos-watcher
        mode: "0700"
      loop:
        - /var/lib/minos/watcher/control
        - /var/lib/minos/watcher/archive
        - /var/lib/minos/watcher/staging

    - name: Create the shared public projection directory
      ansible.builtin.file:
        path: /var/lib/minos/public
        state: directory
        owner: minos-watcher
        group: minos-watcher
        mode: "0755"

    - name: Create the preserved Uptime Kuma data directory
      ansible.builtin.file:
        path: /var/lib/minos/uptime-kuma
        state: directory
        owner: minos-uptime-kuma
        group: minos-uptime-kuma
        mode: "0700"

    - name: Pin the Uptime Kuma image identity to its preserved data
      ansible.builtin.copy:
        content: "{{ uptime_kuma_image_reference }}\n"
        dest: /var/lib/minos/uptime-kuma/.minos-image-reference
        owner: root
        group: minos-uptime-kuma
        mode: "0444"
        unsafe_writes: false

    - name: Inspect restorable watcher control files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/minos/watcher/control/control.sqlite3
        - /var/lib/minos/watcher/control/control.sqlite3-wal
        - /var/lib/minos/watcher/control/control.sqlite3-shm
        - /var/lib/minos/watcher/control/watcher.lock
      register: watcher_control_files

    - name: Reapply ownership to known control files after a restore
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: file
        owner: minos-watcher
        group: minos-watcher
        mode: "0600"
      loop: "{{ watcher_control_files.results }}"
      when: item.stat.exists and (item.stat.isreg | default(false))

    - name: Persist the disk-backed watcher staging mount boundary
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: >-
          ^/var/lib/minos/watcher/staging\s+/var/lib/minos/watcher/staging\s+
        line: >-
          /var/lib/minos/watcher/staging /var/lib/minos/watcher/staging none bind,rw,noexec,nosuid,nodev 0 0
        owner: root
        group: root
        mode: "0644"

    - name: Detect the watcher staging mountpoint
      ansible.builtin.command:
        argv: [mountpoint, --quiet, /var/lib/minos/watcher/staging]
      register: watcher_staging_mountpoint
      changed_when: false
      failed_when: watcher_staging_mountpoint.rc not in [0, 32]
      when: not ansible_check_mode

    - name: Create the disk-backed watcher staging bind mount
      ansible.builtin.command:
        argv:
          - mount
          - --bind
          - /var/lib/minos/watcher/staging
          - /var/lib/minos/watcher/staging
      when:
        - not ansible_check_mode
        - watcher_staging_mountpoint.rc == 32
      changed_when: true

    - name: Enforce watcher staging mount restrictions
      ansible.builtin.command:
        argv:
          - mount
          - --options
          - remount,bind,rw,noexec,nosuid,nodev
          - /var/lib/minos/watcher/staging
      changed_when: false
      when: not ansible_check_mode

    - name: Read watcher staging mount restrictions
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --output
          - OPTIONS
          - --target
          - /var/lib/minos/watcher/staging
      register: watcher_staging_mount_options
      changed_when: false
      when: not ansible_check_mode

    - name: Require the watcher staging mount boundary
      ansible.builtin.assert:
        that:
          - "'rw' in watcher_staging_mount_options.stdout.split(',')"
          - "'noexec' in watcher_staging_mount_options.stdout.split(',')"
          - "'nosuid' in watcher_staging_mount_options.stdout.split(',')"
          - "'nodev' in watcher_staging_mount_options.stdout.split(',')"
        fail_msg: The watcher staging path is not a hardened disk-backed mount.
      when: not ansible_check_mode

    - name: Stage the validated AWS watcher credential candidate
      ansible.builtin.copy:
        content: "{{ watcher_aws_credentials_candidate_payload }}"
        dest: /etc/minos/watcher/candidate/aws/credentials
        owner: root
        group: minos-watcher-secrets
        mode: "0440"
        unsafe_writes: false
      when: not ansible_check_mode
      no_log: true

    - name: Inspect the staged AWS watcher credential candidate
      ansible.builtin.stat:
        path: /etc/minos/watcher/candidate/aws/credentials
      register: watcher_aws_credentials_candidate
      when: not ansible_check_mode
      no_log: true

    - name: Require the exact staged AWS watcher credential candidate
      ansible.builtin.assert:
        that:
          - watcher_aws_credentials_candidate.stat.exists
          - watcher_aws_credentials_candidate.stat.isreg
          - watcher_aws_credentials_candidate.stat.uid == 0
          - watcher_aws_credentials_candidate.stat.gid == watcher_secrets_gid
          - watcher_aws_credentials_candidate.stat.mode == '0440'
          - >-
            watcher_aws_credentials_candidate.stat.checksum ==
            watcher_aws_credentials_candidate_payload | hash('sha1')
        fail_msg: The staged AWS watcher credential differs from its validated payload.
      when: not ansible_check_mode
      no_log: true

    - name: Stage the validated Uptime Kuma watcher target candidate
      ansible.builtin.copy:
        content: "{{ watcher_uptime_kuma_targets_candidate_payload }}"
        dest: /etc/minos/watcher/candidate/uptime-kuma/targets.json
        owner: root
        group: minos-watcher-secrets
        mode: "0440"
        unsafe_writes: false
      when: not ansible_check_mode
      no_log: true

    - name: Inspect the staged Uptime Kuma watcher target candidate
      ansible.builtin.stat:
        path: /etc/minos/watcher/candidate/uptime-kuma/targets.json
      register: watcher_uptime_kuma_targets_candidate
      when: not ansible_check_mode
      no_log: true

    - name: Require the exact staged Uptime Kuma watcher target candidate
      ansible.builtin.assert:
        that:
          - watcher_uptime_kuma_targets_candidate.stat.exists
          - watcher_uptime_kuma_targets_candidate.stat.isreg
          - watcher_uptime_kuma_targets_candidate.stat.uid == 0
          - watcher_uptime_kuma_targets_candidate.stat.gid == watcher_secrets_gid
          - watcher_uptime_kuma_targets_candidate.stat.mode == '0440'
          - >-
            watcher_uptime_kuma_targets_candidate.stat.checksum ==
            watcher_uptime_kuma_targets_candidate_payload | hash('sha1')
        fail_msg: The staged Uptime Kuma watcher target differs from its validated payload.
      when: not ansible_check_mode
      no_log: true

    - name: Stage the non-secret Minos runtime files
      ansible.builtin.copy:
        src: "files/{{ item.src }}"
        dest: "/opt/minos/candidate/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - src: edge-nginx.conf
          dest: edge/nginx.conf
        - src: maintenance-index.html
          dest: edge/index.html
        - src: home.css
          dest: edge/home.css
        - src: legal.css
          dest: edge/legal.css
        - src: plausible-init.js
          dest: edge/plausible-init.js
        - src: privacy-policy.html
          dest: edge/privacy-policy.html
        - src: sources.css
          dest: edge/sources.css
        - src: sources.html
          dest: edge/sources.html
        - src: sources.js
          dest: edge/sources.js
        - src: terms.html
          dest: edge/terms.html
        - src: minos-compose.service
          dest: minos-compose.service

    - name: Render the host-specific cloudflared configuration
      ansible.builtin.template:
        src: cloudflared-config.yml.j2
        dest: /opt/minos/candidate/cloudflared-config.yml
        owner: root
        group: root
        mode: "0644"

    - name: Stage the validated cloudflared credential candidate
      ansible.builtin.copy:
        content: "{{ cloudflared_credential_candidate_payload }}"
        dest: "/etc/minos/cloudflared/candidate/{{ cloudflared_tunnel_id }}.json"
        owner: root
        group: minos-cloudflared
        mode: "0440"
        unsafe_writes: false
      when: not ansible_check_mode
      no_log: true

    - name: Inspect the staged cloudflared credential candidate
      ansible.builtin.stat:
        path: "/etc/minos/cloudflared/candidate/{{ cloudflared_tunnel_id }}.json"
      register: cloudflared_credential_candidate
      when: not ansible_check_mode
      no_log: true

    - name: Require the exact staged cloudflared credential candidate
      ansible.builtin.assert:
        that:
          - cloudflared_credential_candidate.stat.exists
          - cloudflared_credential_candidate.stat.isreg
          - cloudflared_credential_candidate.stat.pw_name == "root"
          - cloudflared_credential_candidate.stat.gr_name == "minos-cloudflared"
          - cloudflared_credential_candidate.stat.mode == "0440"
          - cloudflared_credential_candidate.stat.size in range(64, 4097)
          - >-
            cloudflared_credential_candidate.stat.checksum ==
            cloudflared_credential_candidate_payload | hash('sha1')
        fail_msg: The staged tunnel credential differs from its validated payload.
      when: not ansible_check_mode
      no_log: true

    - name: Read the exact candidate watcher registry manifest
      ansible.builtin.command:
        argv:
          - docker
          - manifest
          - inspect
          - "{{ watcher_image_repository }}@{{ watcher_expected_image_digest }}"
      register: watcher_candidate_registry_manifest
      changed_when: false
      when: not ansible_check_mode

    - name: Require one runnable candidate watcher manifest
      ansible.builtin.assert:
        that:
          - >-
            (watcher_candidate_registry_manifest.stdout | from_json).mediaType in
            ['application/vnd.oci.image.manifest.v1+json',
             'application/vnd.docker.distribution.manifest.v2+json']
          - (watcher_candidate_registry_manifest.stdout | from_json).config is mapping
          - >-
            (watcher_candidate_registry_manifest.stdout | from_json).layers |
            length in range(1, 129)
          - >-
            'manifests' not in
            (watcher_candidate_registry_manifest.stdout | from_json)
        fail_msg: The reviewed watcher digest is not one runnable image manifest.
      when: not ansible_check_mode

    - name: Pull the exact candidate watcher image
      ansible.builtin.command:
        argv:
          - docker
          - image
          - pull
          - "{{ watcher_image_repository }}@{{ watcher_expected_image_digest }}"
      register: watcher_candidate_pull
      changed_when: "'Downloaded newer image' in watcher_candidate_pull.stdout"
      when: not ansible_check_mode

    - name: Inspect the host-observed candidate watcher identity
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - --format
          - >-
            {{ '{{.Os}}/{{.Architecture}}|{{json .RepoDigests}}|{{index
            .Config.Labels "org.opencontainers.image.revision"}}' }}
          - "{{ watcher_image_repository }}@{{ watcher_expected_image_digest }}"
      register: watcher_candidate_image
      changed_when: false
      when: not ansible_check_mode

    - name: Require the exact candidate watcher image
      ansible.builtin.assert:
        that:
          - watcher_candidate_image.stdout.split('|')[0] == 'linux/amd64'
          - >-
            watcher_image_repository + '@' + watcher_expected_image_digest in
            (watcher_candidate_image.stdout.split('|')[1] | from_json)
          - watcher_candidate_image.stdout.split('|')[2] == watcher_source_revision
        fail_msg: The candidate watcher image identity or architecture is invalid.
      when: not ansible_check_mode

    - name: Record the host-observed candidate watcher digest
      ansible.builtin.set_fact:
        watcher_runtime_image_reference: >-
          {{
            watcher_candidate_image.stdout.split('|')[1] | from_json |
            select('equalto', watcher_image_repository + '@' +
                   watcher_expected_image_digest) | list | first
          }}
      when: not ansible_check_mode

    - name: Derive the runtime digest from the host-observed identity
      ansible.builtin.set_fact:
        watcher_runtime_image_digest: >-
          {{ watcher_runtime_image_reference.split('@')[1] }}
      when: not ansible_check_mode

    - name: Pull the exact Uptime Kuma image
      ansible.builtin.command:
        argv:
          - docker
          - image
          - pull
          - --platform
          - linux/amd64
          - "{{ uptime_kuma_image_reference }}"
      register: uptime_kuma_pull
      changed_when: "'Downloaded newer image' in uptime_kuma_pull.stdout"
      when: not ansible_check_mode

    - name: Inspect the host-observed Uptime Kuma image identity
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - --format
          - "{{ '{{.Os}}/{{.Architecture}}|{{.Config.User}}|{{json .RepoDigests}}' }}"
          - "{{ uptime_kuma_image_reference }}"
      register: uptime_kuma_image
      changed_when: false
      when: not ansible_check_mode

    - name: Require the exact Uptime Kuma image identity architecture and user
      ansible.builtin.assert:
        that:
          - uptime_kuma_image.stdout.split('|')[0] == 'linux/amd64'
          - uptime_kuma_image.stdout.split('|')[1] == 'node'
          - >-
            'louislam/uptime-kuma@sha256:8bdad438d293e998fd7d45004cefb3baea0f96d3bc774502bba99c17d616e1f6' in
            (uptime_kuma_image.stdout.split('|')[2] | from_json)
        fail_msg: The pinned Uptime Kuma image identity architecture or user is invalid.
      when: not ansible_check_mode

    - name: Read the pinned Uptime Kuma upstream numeric user without root
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - --read-only
          - --cap-drop
          - ALL
          - --security-opt
          - no-new-privileges:true
          - --entrypoint
          - /usr/bin/id
          - "{{ uptime_kuma_image_reference }}"
          - -u
      register: uptime_kuma_upstream_uid
      changed_when: false
      when: not ansible_check_mode

    - name: Require the pinned Uptime Kuma upstream numeric user
      ansible.builtin.assert:
        that:
          - uptime_kuma_upstream_uid.stdout == '1000'
        fail_msg: The pinned Uptime Kuma upstream user no longer resolves to UID 1000.
      when: not ansible_check_mode

    - name: Stage the candidate Minos Compose model
      ansible.builtin.template:
        src: minos-compose.yml.j2
        dest: /opt/minos/candidate/compose.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Validate the candidate Nginx configuration with the pinned image
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - --read-only
          - --tmpfs
          - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=101,gid=101,mode=0700
          - --entrypoint
          - nginx
          - --volume
          - /opt/minos/candidate/edge/nginx.conf:/etc/nginx/nginx.conf:ro
          - --volume
          - /opt/minos/candidate/edge/index.html:/usr/share/nginx/html/index.html:ro
          - --volume
          - /opt/minos/candidate/edge/home.css:/usr/share/nginx/html/home.css:ro
          - --volume
          - /opt/minos/candidate/edge/legal.css:/usr/share/nginx/html/legal.css:ro
          - --volume
          - /opt/minos/candidate/edge/plausible-init.js:/usr/share/nginx/html/plausible-init.js:ro
          - --volume
          - /opt/minos/candidate/edge/privacy-policy.html:/usr/share/nginx/html/privacy-policy.html:ro
          - --volume
          - /opt/minos/candidate/edge/sources.css:/usr/share/nginx/html/sources.css:ro
          - --volume
          - /opt/minos/candidate/edge/sources.html:/usr/share/nginx/html/sources.html:ro
          - --volume
          - /opt/minos/candidate/edge/sources.js:/usr/share/nginx/html/sources.js:ro
          - --volume
          - /opt/minos/candidate/edge/terms.html:/usr/share/nginx/html/terms.html:ro
          - docker.io/nginxinc/nginx-unprivileged@sha256:b54ac358b83fc6c965793fd271839b4ea4cdb6e99895bb19618cbc2ca152d972
          - -t
      changed_when: false
      when: not ansible_check_mode

    - name: Validate the candidate cloudflared ingress with the pinned image
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - --volume
          - /opt/minos/candidate/cloudflared-config.yml:/etc/cloudflared/config.yml:ro
          - docker.io/cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          - tunnel
          - --config
          - /etc/cloudflared/config.yml
          - ingress
          - validate
      changed_when: false
      when: not ansible_check_mode

    - name: Load the candidate cloudflared credential with the pinned image
      ansible.builtin.command:
        argv:
          - timeout
          - --signal=TERM
          - --kill-after=2s
          - 5s
          - docker
          - run
          - --rm
          - --stop-timeout
          - "1"
          - --network
          - none
          - --read-only
          - --user
          - "65532:65532"
          - --cap-drop
          - ALL
          - --security-opt
          - no-new-privileges:true
          - --tmpfs
          - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532,mode=0700
          - --volume
          - /opt/minos/candidate/cloudflared-config.yml:/etc/cloudflared/config.yml:ro
          - --volume
          - /etc/minos/cloudflared/candidate/{{ cloudflared_tunnel_id }}.json:/run/secrets/cloudflared-credentials.json:ro
          - docker.io/cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
          - tunnel
          - --config
          - /etc/cloudflared/config.yml
          - --no-autoupdate
          - --no-prechecks
          - --retries
          - "100"
          - run
      register: cloudflared_candidate_credential_load
      changed_when: false
      failed_when: >-
        cloudflared_candidate_credential_load.rc != 124 and not
        (cloudflared_candidate_credential_load.rc == 1 and
         'Starting tunnel' in cloudflared_candidate_credential_load.stderr and
         'Could not lookup srv records' in cloudflared_candidate_credential_load.stderr and
         'connect: network is unreachable' in cloudflared_candidate_credential_load.stderr)
      when: not ansible_check_mode
      no_log: true

    - name: Validate the candidate Minos Compose model
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - /opt/minos/candidate/compose.yaml
          - config
          - --quiet
      changed_when: false
      when: not ansible_check_mode

    - name: Inspect the candidate Minos runtime files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - {key: compose, path: /opt/minos/candidate/compose.yaml}
        - {key: nginx, path: /opt/minos/candidate/edge/nginx.conf}
        - {key: index, path: /opt/minos/candidate/edge/index.html}
        - {key: legal_css, path: /opt/minos/candidate/edge/legal.css}
        - {key: plausible, path: /opt/minos/candidate/edge/plausible-init.js}
        - {key: privacy, path: /opt/minos/candidate/edge/privacy-policy.html}
        - {key: terms, path: /opt/minos/candidate/edge/terms.html}
        - {key: home_css, path: /opt/minos/candidate/edge/home.css}
        - {key: sources_css, path: /opt/minos/candidate/edge/sources.css}
        - {key: sources_html, path: /opt/minos/candidate/edge/sources.html}
        - {key: sources_js, path: /opt/minos/candidate/edge/sources.js}
        - {key: cloudflared, path: /opt/minos/candidate/cloudflared-config.yml}
        - {key: systemd, path: /opt/minos/candidate/minos-compose.service}
      register: watcher_candidate_runtime_files
      when: not ansible_check_mode

    - name: Require a complete candidate Minos runtime
      ansible.builtin.assert:
        that:
          - >-
            watcher_candidate_runtime_files.results |
            selectattr('stat.isreg') | list | length == 13
        fail_msg: The candidate Minos runtime is incomplete.
      when: not ansible_check_mode

    - name: Inspect the active Minos runtime files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - {key: compose, path: /opt/minos/compose.yaml}
        - {key: nginx, path: /opt/minos/edge/nginx.conf}
        - {key: index, path: /opt/minos/edge/index.html}
        - {key: legal_css, path: /opt/minos/edge/legal.css}
        - {key: plausible, path: /opt/minos/edge/plausible-init.js}
        - {key: privacy, path: /opt/minos/edge/privacy-policy.html}
        - {key: terms, path: /opt/minos/edge/terms.html}
        - {key: home_css, path: /opt/minos/edge/home.css}
        - {key: sources_css, path: /opt/minos/edge/sources.css}
        - {key: sources_html, path: /opt/minos/edge/sources.html}
        - {key: sources_js, path: /opt/minos/edge/sources.js}
        - {key: cloudflared, path: /etc/minos/cloudflared/config.yml}
        - {key: systemd, path: /etc/systemd/system/minos-compose.service}
      register: watcher_active_runtime_files
      when: not ansible_check_mode

    - name: Initialize logical Minos runtime checksum maps
      ansible.builtin.set_fact:
        watcher_candidate_runtime_checksums: {}
        watcher_active_runtime_checksums: {}
      when: not ansible_check_mode

    - name: Index candidate Minos runtime checksums by logical destination
      ansible.builtin.set_fact:
        watcher_candidate_runtime_checksums: >-
          {{ watcher_candidate_runtime_checksums |
             combine({item.item.key: item.stat.checksum}) }}
      loop: "{{ watcher_candidate_runtime_files.results }}"
      when: not ansible_check_mode

    - name: Index active Minos runtime checksums by logical destination
      ansible.builtin.set_fact:
        watcher_active_runtime_checksums: >-
          {{ watcher_active_runtime_checksums |
             combine({item.item.key: item.stat.checksum | default('')}) }}
      loop: "{{ watcher_active_runtime_files.results }}"
      when: not ansible_check_mode

    - name: Reject a partial active Minos runtime
      ansible.builtin.assert:
        that:
          - >-
            (watcher_active_runtime_files.results |
             selectattr('stat.exists') | list | length == 0) or
            (watcher_active_runtime_files.results[:7] |
             selectattr('stat.exists') | list | length == 7 and
             ((watcher_active_runtime_files.results[7].stat.exists and
               watcher_active_runtime_files.results[8:11] |
               selectattr('stat.exists') | list | length == 3) or
              ((not watcher_active_runtime_files.results[7].stat.exists) and
               watcher_active_runtime_files.results[8:11] |
               selectattr('stat.exists') | list | length in [0, 3])) and
             watcher_active_runtime_files.results[11:] |
             selectattr('stat.exists') | list | length == 2)
          - >-
            watcher_active_runtime_files.results |
            selectattr('stat.isreg', 'defined') |
            selectattr('stat.isreg') | list | length ==
            watcher_active_runtime_files.results |
            selectattr('stat.exists') | list | length
        fail_msg: The active Minos runtime is partial and cannot be safely rolled back.
      when: not ansible_check_mode

    - name: Record whether a prior Minos runtime exists
      ansible.builtin.set_fact:
        watcher_prior_runtime_exists: >-
          {{
            watcher_active_runtime_files.results[:7] |
            selectattr('stat.exists') | list | length == 7 and
            ((watcher_active_runtime_files.results[7].stat.exists and
              watcher_active_runtime_files.results[8:11] |
              selectattr('stat.exists') | list | length == 3) or
             ((not watcher_active_runtime_files.results[7].stat.exists) and
              watcher_active_runtime_files.results[8:11] |
              selectattr('stat.exists') | list | length in [0, 3])) and
            watcher_active_runtime_files.results[11:] |
            selectattr('stat.exists') | list | length == 2
          }}
      when: not ansible_check_mode

    - name: Read active Minos Compose services
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - minos
          - --file
          - /opt/minos/compose.yaml
          - config
          - --services
      register: watcher_active_services
      changed_when: false
      when:
        - not ansible_check_mode
        - watcher_prior_runtime_exists

    - name: Read the active watcher container identity
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - minos
          - --file
          - /opt/minos/compose.yaml
          - ps
          - --quiet
          - watcher
      register: watcher_active_container
      changed_when: false
      when:
        - not ansible_check_mode
        - watcher_prior_runtime_exists
        - "'watcher' in watcher_active_services.stdout_lines"

    - name: Read the active watcher image reference
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{.Config.Image}}' }}"
          - "{{ watcher_active_container.stdout }}"
      register: watcher_active_image
      changed_when: false
      when:
        - not ansible_check_mode
        - watcher_prior_runtime_exists
        - "'watcher' in watcher_active_services.stdout_lines"
        - watcher_active_container.stdout | length > 0

    - name: Calculate whether Minos activation is required
      ansible.builtin.set_fact:
        watcher_activation_required: >-
          {{
            (not watcher_prior_runtime_exists) or
            (watcher_candidate_runtime_checksums !=
             watcher_active_runtime_checksums) or
            (watcher_aws_credentials_preflight.stat.checksum | default('') !=
             watcher_aws_credentials_candidate.stat.checksum) or
            (watcher_uptime_kuma_targets_preflight.stat.checksum | default('') !=
             watcher_uptime_kuma_targets_candidate.stat.checksum) or
            (cloudflared_credential_preflight.stat.checksum | default('') !=
             cloudflared_credential_candidate.stat.checksum) or
            (watcher_active_image.stdout | default('', true) !=
             watcher_image_repository + '@' + watcher_runtime_image_digest)
          }}
      when: not ansible_check_mode

    - name: Reset isolated candidate preflight data for a changed deployment
      ansible.builtin.file:
        path: /var/lib/minos/watcher/candidate-preflight
        state: absent
      when:
        - not ansible_check_mode
        - watcher_activation_required

    - name: Create isolated candidate preflight directories
      ansible.builtin.file:
        path: "/var/lib/minos/watcher/candidate-preflight/{{ item }}"
        state: directory
        owner: minos-watcher
        group: minos-watcher
        mode: "0700"
      loop:
        - control
        - archive
        - staging
        - public
      when:
        - not ansible_check_mode
        - watcher_activation_required

    - name: Inspect the live watcher control database
      ansible.builtin.stat:
        path: /var/lib/minos/watcher/control/control.sqlite3
      register: watcher_live_control_database
      when:
        - not ansible_check_mode
        - watcher_activation_required

    - name: Create consistent isolated candidate database evidence
      ansible.builtin.command:
        argv:
          - timeout
          - --signal=TERM
          - --kill-after=5s
          - 300s
          - docker
          - run
          - --rm
          - --network
          - none
          - --read-only
          - --user
          - "{{ watcher_uid }}:{{ watcher_gid }}"
          - --cap-drop
          - ALL
          - --security-opt
          - no-new-privileges:true
          - --volume
          - /var/lib/minos/watcher/control:/source:ro
          - --volume
          - /var/lib/minos/watcher/candidate-preflight/control:/destination:rw
          - "{{ watcher_image_repository }}@{{ watcher_runtime_image_digest }}"
          - watcher
          - copy-control-database
          - --source-database
          - /source/control.sqlite3
          - --destination-database
          - /destination/control.sqlite3
      changed_when: false
      when:
        - not ansible_check_mode
        - watcher_activation_required
        - watcher_live_control_database.stat.exists
        - watcher_live_control_database.stat.isreg | default(false)

    - name: Run the isolated scheduler-paused candidate preflight
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - minos-candidate
          - --file
          - /opt/minos/candidate/compose.yaml
          - --profile
          - candidate-preflight
          - run
          - --rm
          - watcher-candidate-preflight
      changed_when: false
      when:
        - not ansible_check_mode
        - watcher_activation_required

    - name: Reset the Minos activation evidence directory
      ansible.builtin.file:
        path: /opt/minos/rollback
        state: absent
      when:
        - not ansible_check_mode
        - watcher_activation_required

    - name: Create the Minos runtime rollback directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /opt/minos/rollback
        - /opt/minos/rollback/edge
        - /opt/minos/rollback/secrets
        - /opt/minos/rollback/secrets/cloudflared
        - /opt/minos/rollback/secrets/aws
        - /opt/minos/rollback/secrets/uptime-kuma
      when:
        - not ansible_check_mode
        - watcher_activation_required

    - name: Create the Minos preactivation database evidence directory
      ansible.builtin.file:
        path: /opt/minos/rollback/control
        state: directory
        owner: minos-watcher
        group: minos-watcher
        mode: "0700"
      when:
        - not ansible_check_mode
        - watcher_activation_required

    - name: Snapshot the active Minos runtime files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/opt/minos/rollback/{{ item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop:
        - {src: /opt/minos/compose.yaml, dest: compose.yaml}
        - {src: /opt/minos/edge/nginx.conf, dest: edge/nginx.conf}
        - {src: /opt/minos/edge/index.html, dest: edge/index.html}
        - {src: /opt/minos/edge/legal.css, dest: edge/legal.css}
        - {src: /opt/minos/edge/plausible-init.js, dest: edge/plausible-init.js}
        - {src: /opt/minos/edge/privacy-policy.html, dest: edge/privacy-policy.html}
        - {src: /opt/minos/edge/terms.html, dest: edge/terms.html}
        - {src: /etc/minos/cloudflared/config.yml, dest: cloudflared-config.yml}
        - {src: /etc/systemd/system/minos-compose.service, dest: minos-compose.service}
      when:
        - not ansible_check_mode
        - watcher_activation_required
        - watcher_prior_runtime_exists

    - name: Snapshot active AWS watcher credentials before replacement
      ansible.builtin.copy:
        src: /etc/minos/watcher/aws/credentials
        dest: /opt/minos/rollback/secrets/aws/credentials
        remote_src: true
        owner: root
        group: root
        mode: "0600"
        unsafe_writes: false
      when:
        - not ansible_check_mode
        - watcher_activation_required
        - watcher_aws_credentials_preflight.stat.exists
      no_log: true

    - name: Snapshot active Uptime Kuma watcher targets before replacement
      ansible.builtin.copy:
        src: /etc/minos/watcher/uptime-kuma/targets.json
        dest: /opt/minos/rollback/secrets/uptime-kuma/targets.json
        remote_src: true
        owner: root
        group: root
        mode: "0600"
        unsafe_writes: false
      when:
        - not ansible_check_mode
        - watcher_activation_required
        - watcher_uptime_kuma_targets_preflight.stat.exists
      no_log: true

    - name: Snapshot prior optional edge page files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/opt/minos/rollback/{{ item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop:
        - src: /opt/minos/edge/home.css
          dest: edge/home.css
          exists: "{{ watcher_active_runtime_files.results[7].stat.exists }}"
        - src: /opt/minos/edge/sources.css
          dest: edge/sources.css
          exists: "{{ watcher_active_runtime_files.results[8].stat.exists }}"
        - src: /opt/minos/edge/sources.html
          dest: edge/sources.html
          exists: "{{ watcher_active_runtime_files.results[9].stat.exists }}"
        - src: /opt/minos/edge/sources.js
          dest: edge/sources.js
          exists: "{{ watcher_active_runtime_files.results[10].stat.exists }}"
      when:
        - not ansible_check_mode
        - watcher_activation_required
        - watcher_prior_runtime_exists
        - item.exists | bool

    - name: Snapshot the active cloudflared credential before replacement
      ansible.builtin.copy:
        src: "{{ cloudflared_credential_path }}"
        dest: "/opt/minos/rollback/secrets/cloudflared/{{ cloudflared_tunnel_id }}.json"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
        unsafe_writes: false
      when:
        - not ansible_check_mode
        - watcher_activation_required
        - cloudflared_credential_preflight.stat.exists
      no_log: true

    - name: Activate the validated Minos candidate with runtime rollback
      when:
        - not ansible_check_mode
        - watcher_activation_required
      block:
        - name: Stop the active Minos stack after candidate validation
          ansible.builtin.systemd_service:
            name: minos-compose.service
            state: stopped
          when: watcher_prior_runtime_exists

        - name: Capture stopped preactivation database evidence
          ansible.builtin.command:
            argv:
              - timeout
              - --signal=TERM
              - --kill-after=5s
              - 300s
              - docker
              - run
              - --rm
              - --network
              - none
              - --read-only
              - --user
              - "{{ watcher_uid }}:{{ watcher_gid }}"
              - --cap-drop
              - ALL
              - --security-opt
              - no-new-privileges:true
              - --volume
              - /var/lib/minos/watcher/control:/source:ro
              - --volume
              - /opt/minos/rollback/control:/destination:rw
              - "{{ watcher_image_repository }}@{{ watcher_runtime_image_digest }}"
              - watcher
              - copy-control-database
              - --source-database
              - /source/control.sqlite3
              - --destination-database
              - /destination/preactivation.sqlite3
          changed_when: false
          when:
            - watcher_live_control_database.stat.exists
            - watcher_live_control_database.stat.isreg | default(false)

        - name: Atomically promote validated AWS watcher credentials while stopped
          ansible.builtin.copy:
            src: /etc/minos/watcher/candidate/aws/credentials
            dest: /etc/minos/watcher/aws/credentials
            remote_src: true
            owner: root
            group: minos-watcher-secrets
            mode: "0440"
            unsafe_writes: false
          no_log: true

        - name: Atomically promote validated Uptime Kuma watcher targets while stopped
          ansible.builtin.copy:
            src: /etc/minos/watcher/candidate/uptime-kuma/targets.json
            dest: /etc/minos/watcher/uptime-kuma/targets.json
            remote_src: true
            owner: root
            group: minos-watcher-secrets
            mode: "0440"
            unsafe_writes: false
          no_log: true

        - name: Atomically promote the validated cloudflared credential while stopped
          ansible.builtin.copy:
            src: "/etc/minos/cloudflared/candidate/{{ cloudflared_tunnel_id }}.json"
            dest: "{{ cloudflared_credential_path }}"
            remote_src: true
            owner: root
            group: minos-cloudflared
            mode: "0440"
            unsafe_writes: false
          no_log: true

        - name: Inspect the promoted cloudflared credential
          ansible.builtin.stat:
            path: "{{ cloudflared_credential_path }}"
          register: cloudflared_promoted_credential
          no_log: true

        - name: Require the exact promoted cloudflared credential
          ansible.builtin.assert:
            that:
              - cloudflared_promoted_credential.stat.exists
              - cloudflared_promoted_credential.stat.isreg
              - cloudflared_promoted_credential.stat.pw_name == 'root'
              - cloudflared_promoted_credential.stat.gr_name == 'minos-cloudflared'
              - cloudflared_promoted_credential.stat.mode == '0440'
              - cloudflared_promoted_credential.stat.size in range(64, 4097)
              - >-
                cloudflared_promoted_credential.stat.checksum ==
                cloudflared_credential_candidate.stat.checksum
            fail_msg: The promoted tunnel credential differs from its validated candidate.
          no_log: true

        - name: Inspect promoted AWS watcher credentials
          ansible.builtin.stat:
            path: /etc/minos/watcher/aws/credentials
          register: watcher_promoted_aws_credentials
          no_log: true

        - name: Require exact promoted AWS watcher credentials
          ansible.builtin.assert:
            that:
              - watcher_promoted_aws_credentials.stat.exists
              - watcher_promoted_aws_credentials.stat.isreg
              - watcher_promoted_aws_credentials.stat.uid == 0
              - watcher_promoted_aws_credentials.stat.gid == watcher_secrets_gid
              - watcher_promoted_aws_credentials.stat.mode == '0440'
              - >-
                watcher_promoted_aws_credentials.stat.checksum ==
                watcher_aws_credentials_candidate.stat.checksum
            fail_msg: The promoted AWS watcher credential differs from its validated candidate.
          no_log: true

        - name: Inspect promoted Uptime Kuma watcher targets
          ansible.builtin.stat:
            path: /etc/minos/watcher/uptime-kuma/targets.json
          register: watcher_promoted_uptime_kuma_targets
          no_log: true

        - name: Require exact promoted Uptime Kuma watcher targets
          ansible.builtin.assert:
            that:
              - watcher_promoted_uptime_kuma_targets.stat.exists
              - watcher_promoted_uptime_kuma_targets.stat.isreg
              - watcher_promoted_uptime_kuma_targets.stat.uid == 0
              - watcher_promoted_uptime_kuma_targets.stat.gid == watcher_secrets_gid
              - watcher_promoted_uptime_kuma_targets.stat.mode == '0440'
              - >-
                watcher_promoted_uptime_kuma_targets.stat.checksum ==
                watcher_uptime_kuma_targets_candidate.stat.checksum
            fail_msg: >-
              The promoted Uptime Kuma watcher target differs from its validated candidate.
          no_log: true

        - name: Promote validated Minos runtime files while stopped
          ansible.builtin.copy:
            src: "/opt/minos/candidate/{{ item.src }}"
            dest: "{{ item.dest }}"
            remote_src: true
            owner: root
            group: "{{ item.group }}"
            mode: "{{ item.mode }}"
            unsafe_writes: false
          loop:
            - src: compose.yaml
              dest: /opt/minos/compose.yaml
              group: root
              mode: "0644"
            - src: edge/nginx.conf
              dest: /opt/minos/edge/nginx.conf
              group: root
              mode: "0644"
            - src: edge/index.html
              dest: /opt/minos/edge/index.html
              group: root
              mode: "0644"
            - src: edge/home.css
              dest: /opt/minos/edge/home.css
              group: root
              mode: "0644"
            - src: edge/legal.css
              dest: /opt/minos/edge/legal.css
              group: root
              mode: "0644"
            - src: edge/plausible-init.js
              dest: /opt/minos/edge/plausible-init.js
              group: root
              mode: "0644"
            - src: edge/privacy-policy.html
              dest: /opt/minos/edge/privacy-policy.html
              group: root
              mode: "0644"
            - src: edge/sources.css
              dest: /opt/minos/edge/sources.css
              group: root
              mode: "0644"
            - src: edge/sources.html
              dest: /opt/minos/edge/sources.html
              group: root
              mode: "0644"
            - src: edge/sources.js
              dest: /opt/minos/edge/sources.js
              group: root
              mode: "0644"
            - src: edge/terms.html
              dest: /opt/minos/edge/terms.html
              group: root
              mode: "0644"
            - src: cloudflared-config.yml
              dest: /etc/minos/cloudflared/config.yml
              group: minos-cloudflared
              mode: "0440"
            - src: minos-compose.service
              dest: /etc/systemd/system/minos-compose.service
              group: root
              mode: "0644"

        - name: Mark the live watcher migration attempt
          ansible.builtin.set_fact:
            watcher_live_migration_attempted: true
            watcher_live_migration_completed: false
            watcher_live_schema_migrated: false

        - name: Migrate the quiesced live watcher control database
          ansible.builtin.command:
            argv:
              - timeout
              - --signal=TERM
              - --kill-after=5s
              - 300s
              - docker
              - compose
              - --project-name
              - minos
              - --file
              - /opt/minos/compose.yaml
              - --profile
              - preflight
              - run
              - --rm
              - --no-deps
              - watcher-preflight
              - watcher
              - migrate-control-database
          register: watcher_live_migration
          changed_when: (watcher_live_migration.stdout | from_json).migrated

        - name: Require the exact live watcher migration result
          ansible.builtin.assert:
            that:
              - >-
                watcher_live_migration.stdout | from_json | length == 3
              - >-
                (watcher_live_migration.stdout | from_json).keys() | list | sort ==
                ['from_version', 'migrated', 'schema_version']
              - (watcher_live_migration.stdout | from_json).from_version is integer
              - (watcher_live_migration.stdout | from_json).from_version in [0, 1, 2, 3, 4]
              - (watcher_live_migration.stdout | from_json).migrated is boolean
              - (watcher_live_migration.stdout | from_json).schema_version == 4
              - >-
                (watcher_live_migration.stdout | from_json).migrated ==
                ((watcher_live_migration.stdout | from_json).from_version != 4)
            fail_msg: The live watcher migration result is invalid.

        - name: Record the exact live watcher migration outcome
          ansible.builtin.set_fact:
            watcher_live_migration_completed: true
            watcher_live_schema_migrated: >-
              {{ (watcher_live_migration.stdout | from_json).migrated }}

        - name: Bootstrap or validate canonical RSK registration before activation
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - minos
              - --file
              - /opt/minos/compose.yaml
              - --profile
              - bootstrap
              - run
              - --rm
              - --no-deps
              - watcher-bootstrap-rsk
          changed_when: true

        - name: Bootstrap NFZ discovery only after independent monitor validation
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - minos
              - --file
              - /opt/minos/compose.yaml
              - --profile
              - preflight
              - run
              - --rm
              - --no-deps
              - watcher-preflight
              - watcher
              - bootstrap-nfz
          changed_when: true
          when: watcher_nfz_activation_enabled

        - name: Validate the existing public RSK projection without collection
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - minos
              - --file
              - /opt/minos/compose.yaml
              - --profile
              - preflight
              - run
              - --rm
              - --no-deps
              - watcher-preflight
              - watcher
              - validate-public-rsk
              - --public-directory
              - /var/lib/minos/public
          register: public_projection_preactivation
          changed_when: false

        - name: Record the validated preactivation public RSK state
          ansible.builtin.set_fact:
            public_projection_preactivation_document: >-
              {{ public_projection_preactivation.stdout | from_json }}

        - name: Require an absent or schema-valid preactivation projection
          ansible.builtin.assert:
            that:
              - >-
                public_projection_preactivation_document == {'status': 'absent'} or
                (public_projection_preactivation_document.keys() | list | sort ==
                 ['revision', 'sha256', 'status'] and
                 public_projection_preactivation_document.status == 'valid' and
                 public_projection_preactivation_document.revision is integer and
                 public_projection_preactivation_document.revision > 0 and
                 public_projection_preactivation_document.sha256 is match('^[0-9a-f]{64}$'))
            fail_msg: The existing public RSK projection is malformed.

        - name: Run one bounded manual RSK production canary
          ansible.builtin.command:
            argv:
              - timeout
              - --signal=TERM
              - --kill-after=5s
              - 900s
              - docker
              - compose
              - --project-name
              - minos
              - --file
              - /opt/minos/compose.yaml
              - run
              - --rm
              - --no-deps
              - watcher
              - watcher
              - run-once
              - rsk
          changed_when: true

        - name: Validate the canary public RSK projection before activation
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - minos
              - --file
              - /opt/minos/compose.yaml
              - --profile
              - preflight
              - run
              - --rm
              - --no-deps
              - watcher-preflight
              - watcher
              - validate-public-rsk
              - --public-directory
              - /var/lib/minos/public
          register: public_projection_canary
          changed_when: false

        - name: Require a committed canonical RSK canary projection
          ansible.builtin.assert:
            that:
              - >-
                (public_projection_canary.stdout | from_json).keys() | list | sort ==
                ['revision', 'sha256', 'status']
              - (public_projection_canary.stdout | from_json).status == 'valid'
              - (public_projection_canary.stdout | from_json).revision is integer
              - (public_projection_canary.stdout | from_json).revision > 0
              - >-
                (public_projection_canary.stdout | from_json).sha256 is
                match('^[0-9a-f]{64}$')
            fail_msg: The manual RSK canary did not publish a valid projection.

        - name: Start the validated Minos candidate
          ansible.builtin.systemd_service:
            name: minos-compose.service
            daemon_reload: true
            enabled: true
            state: started

        - name: Observe candidate stability after readiness
          ansible.builtin.pause:
            seconds: 30

        - name: Read candidate Minos Compose services
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - minos
              - --file
              - /opt/minos/compose.yaml
              - ps
              - --services
              - --status
              - running
          register: minos_candidate_running_services
          changed_when: false

        - name: Require all candidate Minos services to remain running
          ansible.builtin.assert:
            that:
              - >-
                minos_candidate_running_services.stdout_lines | sort ==
                ['cloudflared', 'edge', 'uptime-kuma', 'watcher']
            fail_msg: Candidate services did not remain running after activation.

        - name: Locate the running production edge container
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - minos
              - --file
              - /opt/minos/compose.yaml
              - ps
              - --quiet
              - edge
          register: minos_candidate_edge_id
          changed_when: false
          failed_when: >-
            minos_candidate_edge_id.rc != 0 or
            minos_candidate_edge_id.stdout_lines | length != 1 or
            minos_candidate_edge_id.stdout is not match('^[0-9a-f]{64}$')

        - name: Smoke the exact Sources page through the production edge
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ minos_candidate_edge_id.stdout }}"
              - wget
              - -S
              - -O
              - "-"
              - --header
              - "Host: minoshealth.pl"
              - http://127.0.0.1:8080/zrodla
          register: minos_candidate_sources_page
          changed_when: false

        - name: Require the Sources page and strict CSP from the production edge
          ansible.builtin.assert:
            that:
              - "'<title>Źródła danych medycznych - Minos Health</title>' in minos_candidate_sources_page.stdout"
              - "\"style-src 'self'\" in minos_candidate_sources_page.stderr"
              - "\"connect-src 'self' https://plausible.io\" in minos_candidate_sources_page.stderr"
              - "'unsafe-inline' not in minos_candidate_sources_page.stderr"
              - "'200 OK' in minos_candidate_sources_page.stderr"
            fail_msg: The production edge did not serve the reviewed Sources page or CSP.

        - name: Smoke exact stylesheet and script assets through the production edge
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ minos_candidate_edge_id.stdout }}"
              - wget
              - -q
              - -O
              - "-"
              - --header
              - "Host: minoshealth.pl"
              - "http://127.0.0.1:8080{{ item.path }}"
          loop:
            - path: /site.css
              marker: "--accent: #0a5c6e"
            - path: /sources.js
              marker: 'var RSK_PATH = "/api/v1/provenance/rsk"'
          register: minos_candidate_edge_assets
          changed_when: false

        - name: Require exact production edge asset content
          ansible.builtin.assert:
            that:
              - item.item.marker in item.stdout
            fail_msg: The production edge served an unexpected static asset.
          loop: "{{ minos_candidate_edge_assets.results }}"

        - name: Probe the exact provenance endpoint through the production edge
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ minos_candidate_edge_id.stdout }}"
              - wget
              - -S
              - -O
              - "-"
              - --header
              - "Host: minoshealth.pl"
              - --header
              - "Accept-Encoding: identity"
              - http://127.0.0.1:8080/api/v1/provenance/rsk
          register: minos_candidate_provenance_response
          changed_when: false

        - name: Require the exact provenance endpoint response
          ansible.builtin.assert:
            that:
              - minos_candidate_provenance_response.rc == 0
              - "'200 OK' in minos_candidate_provenance_response.stderr"
            fail_msg: The production edge provenance endpoint failed unexpectedly.

        - name: Revalidate a projection served by the production edge
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-name
              - minos
              - --file
              - /opt/minos/compose.yaml
              - exec
              - --no-TTY
              - watcher
              - /app/.venv/bin/minos
              - watcher
              - validate-public-rsk
              - --public-directory
              - /var/lib/minos/public
          register: public_projection_postactivation
          changed_when: false

        - name: Require the edge response to match the validated current projection
          ansible.builtin.assert:
            that:
              - (public_projection_postactivation.stdout | from_json).status == 'valid'
              - >-
                minos_candidate_provenance_response.stdout | hash('sha256') ==
                (public_projection_postactivation.stdout | from_json).sha256
              - "'application/json' in minos_candidate_provenance_response.stderr"
            fail_msg: The production edge provenance response differs from current storage.

      rescue:
        - name: Stop the rejected Minos candidate
          ansible.builtin.systemd_service:
            name: minos-compose.service
            state: stopped
          failed_when: false

        - name: Preserve a migrated live database for explicit recovery
          ansible.builtin.fail:
            msg: >-
              Candidate activation failed after a changed or indeterminate live
              control migration; the candidate runtime and database were preserved
              stopped because an older writer cannot be restarted safely.
          when:
            - watcher_live_migration_attempted | default(false) | bool
            - >-
              (not (watcher_live_migration_completed | default(false) | bool)) or
              (watcher_live_schema_migrated | default(false) | bool)

        - name: Restore the prior cloudflared credential
          ansible.builtin.copy:
            src: "/opt/minos/rollback/secrets/cloudflared/{{ cloudflared_tunnel_id }}.json"
            dest: "{{ cloudflared_credential_path }}"
            remote_src: true
            owner: root
            group: minos-cloudflared
            mode: "0440"
            unsafe_writes: false
          when: cloudflared_credential_preflight.stat.exists
          failed_when: false
          no_log: true

        - name: Remove a rejected initial cloudflared credential
          ansible.builtin.file:
            path: "{{ cloudflared_credential_path }}"
            state: absent
          when: not cloudflared_credential_preflight.stat.exists
          failed_when: false
          no_log: true

        - name: Inspect the cloudflared credential after rollback
          ansible.builtin.stat:
            path: "{{ cloudflared_credential_path }}"
          register: cloudflared_rolled_back_credential
          no_log: true

        - name: Require complete cloudflared credential rollback
          ansible.builtin.assert:
            that:
              - >-
                (cloudflared_credential_preflight.stat.exists and
                 cloudflared_rolled_back_credential.stat.exists and
                 cloudflared_rolled_back_credential.stat.isreg and
                 cloudflared_rolled_back_credential.stat.pw_name == 'root' and
                 cloudflared_rolled_back_credential.stat.gr_name == 'minos-cloudflared' and
                 cloudflared_rolled_back_credential.stat.mode == '0440' and
                 cloudflared_rolled_back_credential.stat.size in range(64, 4097) and
                 cloudflared_rolled_back_credential.stat.checksum ==
                 cloudflared_credential_preflight.stat.checksum) or
                ((not cloudflared_credential_preflight.stat.exists) and
                 (not cloudflared_rolled_back_credential.stat.exists))
            fail_msg: Cloudflared credential rollback was incomplete.
          no_log: true

        - name: Restore prior AWS watcher credentials
          ansible.builtin.copy:
            src: /opt/minos/rollback/secrets/aws/credentials
            dest: /etc/minos/watcher/aws/credentials
            remote_src: true
            owner: root
            group: minos-watcher-secrets
            mode: "0440"
            unsafe_writes: false
          when: watcher_aws_credentials_preflight.stat.exists
          failed_when: false
          no_log: true

        - name: Restore prior Uptime Kuma watcher targets
          ansible.builtin.copy:
            src: /opt/minos/rollback/secrets/uptime-kuma/targets.json
            dest: /etc/minos/watcher/uptime-kuma/targets.json
            remote_src: true
            owner: root
            group: minos-watcher-secrets
            mode: "0440"
            unsafe_writes: false
          when: watcher_uptime_kuma_targets_preflight.stat.exists
          failed_when: false
          no_log: true

        - name: Remove rejected initial Uptime Kuma watcher targets
          ansible.builtin.file:
            path: /etc/minos/watcher/uptime-kuma/targets.json
            state: absent
          when: not watcher_uptime_kuma_targets_preflight.stat.exists
          failed_when: false
          no_log: true

        - name: Inspect Uptime Kuma watcher targets after rollback
          ansible.builtin.stat:
            path: /etc/minos/watcher/uptime-kuma/targets.json
          register: watcher_rolled_back_uptime_kuma_targets
          no_log: true

        - name: Require complete Uptime Kuma watcher target rollback
          ansible.builtin.assert:
            that:
              - >-
                (watcher_uptime_kuma_targets_preflight.stat.exists and
                 watcher_rolled_back_uptime_kuma_targets.stat.exists and
                 watcher_rolled_back_uptime_kuma_targets.stat.isreg and
                 watcher_rolled_back_uptime_kuma_targets.stat.uid == 0 and
                 watcher_rolled_back_uptime_kuma_targets.stat.gid == watcher_secrets_gid and
                 watcher_rolled_back_uptime_kuma_targets.stat.mode == '0440' and
                 watcher_rolled_back_uptime_kuma_targets.stat.checksum ==
                 watcher_uptime_kuma_targets_preflight.stat.checksum) or
                ((not watcher_uptime_kuma_targets_preflight.stat.exists) and
                 (not watcher_rolled_back_uptime_kuma_targets.stat.exists))
            fail_msg: Uptime Kuma watcher target rollback was incomplete.
          no_log: true

        - name: Remove rejected initial AWS watcher credentials
          ansible.builtin.file:
            path: /etc/minos/watcher/aws/credentials
            state: absent
          when: not watcher_aws_credentials_preflight.stat.exists
          failed_when: false
          no_log: true

        - name: Inspect AWS watcher credentials after rollback
          ansible.builtin.stat:
            path: /etc/minos/watcher/aws/credentials
          register: watcher_rolled_back_aws_credentials
          no_log: true

        - name: Require complete AWS watcher credential rollback
          ansible.builtin.assert:
            that:
              - >-
                (watcher_aws_credentials_preflight.stat.exists and
                 watcher_rolled_back_aws_credentials.stat.exists and
                 watcher_rolled_back_aws_credentials.stat.isreg and
                 watcher_rolled_back_aws_credentials.stat.uid == 0 and
                 watcher_rolled_back_aws_credentials.stat.gid == watcher_secrets_gid and
                 watcher_rolled_back_aws_credentials.stat.mode == '0440' and
                 watcher_rolled_back_aws_credentials.stat.checksum ==
                 watcher_aws_credentials_preflight.stat.checksum) or
                ((not watcher_aws_credentials_preflight.stat.exists) and
                 (not watcher_rolled_back_aws_credentials.stat.exists))
            fail_msg: AWS watcher credential rollback was incomplete.
          no_log: true

        - name: Restore prior Minos runtime files and image reference
          ansible.builtin.copy:
            src: "/opt/minos/rollback/{{ item.src }}"
            dest: "{{ item.dest }}"
            remote_src: true
            owner: root
            group: "{{ item.group }}"
            mode: "{{ item.mode }}"
            unsafe_writes: false
          loop:
            - src: compose.yaml
              dest: /opt/minos/compose.yaml
              group: root
              mode: "0644"
            - src: edge/nginx.conf
              dest: /opt/minos/edge/nginx.conf
              group: root
              mode: "0644"
            - src: edge/index.html
              dest: /opt/minos/edge/index.html
              group: root
              mode: "0644"
            - src: edge/legal.css
              dest: /opt/minos/edge/legal.css
              group: root
              mode: "0644"
            - src: edge/plausible-init.js
              dest: /opt/minos/edge/plausible-init.js
              group: root
              mode: "0644"
            - src: edge/privacy-policy.html
              dest: /opt/minos/edge/privacy-policy.html
              group: root
              mode: "0644"
            - src: edge/terms.html
              dest: /opt/minos/edge/terms.html
              group: root
              mode: "0644"
            - src: cloudflared-config.yml
              dest: /etc/minos/cloudflared/config.yml
              group: minos-cloudflared
              mode: "0440"
            - src: minos-compose.service
              dest: /etc/systemd/system/minos-compose.service
              group: root
              mode: "0644"
          when: watcher_prior_runtime_exists

        - name: Remove a rejected initial Minos runtime
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /opt/minos/compose.yaml
            - /opt/minos/edge/nginx.conf
            - /opt/minos/edge/index.html
            - /opt/minos/edge/home.css
            - /opt/minos/edge/legal.css
            - /opt/minos/edge/plausible-init.js
            - /opt/minos/edge/privacy-policy.html
            - /opt/minos/edge/sources.css
            - /opt/minos/edge/sources.html
            - /opt/minos/edge/sources.js
            - /opt/minos/edge/terms.html
            - /etc/minos/cloudflared/config.yml
            - /etc/systemd/system/minos-compose.service
          when: not watcher_prior_runtime_exists

        - name: Restore prior optional edge page files
          ansible.builtin.copy:
            src: "/opt/minos/rollback/edge/{{ item.name }}"
            dest: "/opt/minos/edge/{{ item.name }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
            unsafe_writes: false
          loop:
            - name: home.css
              existed: "{{ watcher_active_runtime_files.results[7].stat.exists }}"
            - name: sources.css
              existed: "{{ watcher_active_runtime_files.results[8].stat.exists }}"
            - name: sources.html
              existed: "{{ watcher_active_runtime_files.results[9].stat.exists }}"
            - name: sources.js
              existed: "{{ watcher_active_runtime_files.results[10].stat.exists }}"
          when:
            - watcher_prior_runtime_exists
            - item.existed | bool

        - name: Remove optional edge page files absent from the prior runtime
          ansible.builtin.file:
            path: "/opt/minos/edge/{{ item.name }}"
            state: absent
          loop:
            - name: home.css
              existed: "{{ watcher_active_runtime_files.results[7].stat.exists }}"
            - name: sources.css
              existed: "{{ watcher_active_runtime_files.results[8].stat.exists }}"
            - name: sources.html
              existed: "{{ watcher_active_runtime_files.results[9].stat.exists }}"
            - name: sources.js
              existed: "{{ watcher_active_runtime_files.results[10].stat.exists }}"
          when:
            - watcher_prior_runtime_exists
            - not (item.existed | bool)

        - name: Reload systemd after rejecting an initial Minos runtime
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: not watcher_prior_runtime_exists

        - name: Restart the prior Minos stack against the current database
          ansible.builtin.systemd_service:
            name: minos-compose.service
            daemon_reload: true
            enabled: true
            state: started
          when: watcher_prior_runtime_exists

        - name: Reject the candidate while preserving database evidence
          ansible.builtin.fail:
            msg: >-
              Candidate activation failed; prior runtime files and image were
              restored against the current database, and database evidence was preserved.

    - name: Inspect the installed cloudflared credential
      ansible.builtin.stat:
        path: "{{ cloudflared_credential_path }}"
      register: cloudflared_installed_credential
      when: not ansible_check_mode
      no_log: true

    - name: Require the installed cloudflared credential security boundary
      ansible.builtin.assert:
        that:
          - cloudflared_installed_credential.stat.exists
          - cloudflared_installed_credential.stat.isreg
          - cloudflared_installed_credential.stat.pw_name == 'root'
          - cloudflared_installed_credential.stat.gr_name == 'minos-cloudflared'
          - cloudflared_installed_credential.stat.mode == '0440'
          - cloudflared_installed_credential.stat.size in range(64, 4097)
          - >-
            cloudflared_installed_credential.stat.checksum ==
            cloudflared_credential_candidate.stat.checksum
        fail_msg: The installed tunnel credential differs from its validated candidate.
      when: not ansible_check_mode
      no_log: true

    - name: Inspect the installed Uptime Kuma watcher targets
      ansible.builtin.stat:
        path: /etc/minos/watcher/uptime-kuma/targets.json
      register: watcher_uptime_kuma_targets_installed
      when: not ansible_check_mode
      no_log: true

    - name: Require the installed Uptime Kuma watcher target security boundary
      ansible.builtin.assert:
        that:
          - watcher_uptime_kuma_targets_installed.stat.exists
          - watcher_uptime_kuma_targets_installed.stat.isreg
          - watcher_uptime_kuma_targets_installed.stat.uid == 0
          - watcher_uptime_kuma_targets_installed.stat.gid == watcher_secrets_gid
          - watcher_uptime_kuma_targets_installed.stat.mode == '0440'
          - >-
            watcher_uptime_kuma_targets_installed.stat.checksum ==
            watcher_uptime_kuma_targets_candidate.stat.checksum
        fail_msg: >-
          The installed Uptime Kuma watcher target differs from its validated candidate.
      when: not ansible_check_mode
      no_log: true

    - name: Read running Minos Compose services
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - minos
          - --file
          - /opt/minos/compose.yaml
          - ps
          - --services
          - --status
          - running
      register: minos_running_services
      changed_when: false
      when: not ansible_check_mode

    - name: Read Minos container identities
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - minos
          - --file
          - /opt/minos/compose.yaml
          - ps
          - --quiet
          - "{{ item }}"
      loop:
        - edge
        - cloudflared
        - uptime-kuma
        - watcher
      register: minos_container_ids
      changed_when: false
