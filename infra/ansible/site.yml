          - minos_cloudflared_boundary[14] | from_json | selectattr('RW', 'equalto', true) | list | length == 0
          - minos_cloudflared_boundary[14] | from_json | selectattr('Type', 'equalto', 'bind') | list | length == 2
          - >-
