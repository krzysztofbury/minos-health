          - minos_cloudflared_boundary[17] == "0"
          - minos_cloudflared_boundary[18] == "20"
          - minos_cloudflared_boundary[19] == "null"
          - minos_uptime_kuma_boundary[0] == "healthy"
          - minos_uptime_kuma_boundary[1] == "{}"
          - minos_uptime_kuma_boundary[2] == uptime_kuma_image_reference
          - minos_uptime_kuma_boundary[3] == "minos_monitoring"
          - minos_uptime_kuma_boundary[4] == "10003:10003"
          - minos_uptime_kuma_boundary[5] == "true"
          - minos_uptime_kuma_boundary[6] | from_json == ['ALL']
          - minos_uptime_kuma_boundary[7] | from_json == ['no-new-privileges:true']
          - minos_uptime_kuma_boundary[8] == "unless-stopped"
          - minos_uptime_kuma_boundary[9] == "402653184"
          - minos_uptime_kuma_boundary[10] == "500000000"
          - minos_uptime_kuma_boundary[11] == "128"
          - >-
            minos_uptime_kuma_boundary[12] | from_json ==
            {'Config': {'max-file': '3', 'max-size': '10m'}, 'Type': 'local'}
          - >-
            (minos_uptime_kuma_boundary[13] | from_json).keys() | list | sort ==
            ['minos_monitoring', 'minos_uptime-kuma-egress']
          - >-
            minos_uptime_kuma_boundary[14] | from_json |
            selectattr('RW', 'equalto', true) | list | length == 1
          - >-
            minos_uptime_kuma_boundary[14] | from_json |
            selectattr('Type', 'equalto', 'bind') | list | length == 1
          - >-
            minos_uptime_kuma_boundary[14] | from_json |
            map(attribute='Destination') | list == ['/app/data']
          - >-
            minos_uptime_kuma_boundary[14] | from_json |
            map(attribute='Source') | list == ['/var/lib/minos/uptime-kuma']
          - >-
            minos_uptime_kuma_boundary[15] | from_json ==
            {'/tmp': 'rw,noexec,nosuid,nodev,size=16m,uid=10003,gid=10003,mode=0700'}
          - minos_uptime_kuma_boundary[16] == "null"
          - minos_uptime_kuma_boundary[17] == "0"
          - minos_uptime_kuma_boundary[18] == "30"
          - >-
            minos_uptime_kuma_boundary[19] | from_json == {'3001/tcp': {}}
          - minos_watcher_boundary[0] == "healthy"
          - minos_watcher_boundary[1] == "{}"
          - >-
            minos_watcher_boundary[2] ==
            watcher_image_repository + '@' + watcher_runtime_image_digest
          - minos_watcher_boundary[3] in ['minos_monitoring', 'minos_watcher-egress']
          - minos_watcher_boundary[4] == "10001:10001"
          - minos_watcher_boundary[5] == "true"
          - minos_watcher_boundary[6] | from_json == ['ALL']
          - minos_watcher_boundary[7] | from_json == ['no-new-privileges:true']
          - minos_watcher_boundary[8] == "unless-stopped"
          - minos_watcher_boundary[9] == "536870912"
          - minos_watcher_boundary[10] == "750000000"
          - minos_watcher_boundary[11] == "64"
          - >-
            minos_watcher_boundary[12] | from_json ==
            {'Config': {'max-file': '3', 'max-size': '10m'}, 'Type': 'local'}
          - >-
            (minos_watcher_boundary[13] | from_json).keys() | list | sort ==
            ['minos_monitoring', 'minos_watcher-egress']
          - >-
            minos_watcher_boundary[14] | from_json |
            selectattr('RW', 'equalto', true) | list | length == 4
          - >-
            minos_watcher_boundary[14] | from_json |
            selectattr('RW', 'equalto', false) | list | length == 2
          - >-
            minos_watcher_boundary[14] | from_json |
            selectattr('Type', 'equalto', 'bind') | list | length == 6
          - >-
            minos_watcher_boundary[14] | from_json | map(attribute='Destination') | sort ==
            ['/run/secrets/aws-credentials', '/run/secrets/uptime-kuma-targets.json',
             '/var/lib/minos/archive',
             '/var/lib/minos/control', '/var/lib/minos/public',
             '/var/lib/minos/staging']
          - >-
            minos_watcher_boundary[14] | from_json | map(attribute='Source') | sort ==
            ['/etc/minos/watcher/aws/credentials',
             '/etc/minos/watcher/uptime-kuma/targets.json',
             '/var/lib/minos/public',
             '/var/lib/minos/watcher/archive', '/var/lib/minos/watcher/control',
             '/var/lib/minos/watcher/staging']
          - >-
            minos_watcher_boundary[15] | from_json ==
            {'/tmp': 'rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700'}
          - minos_watcher_boundary[16] | from_json == ['10002']
          - minos_watcher_boundary[17] == "0"
          - minos_watcher_boundary[18] == "30"
          - minos_watcher_boundary[19] == "null"
        fail_msg: The Minos stack differs from the reviewed runtime boundary.
      when: not ansible_check_mode

    - name: Enable periodic package maintenance
      ansible.builtin.copy:
        src: files/20auto-upgrades
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"

    - name: Configure unattended security upgrades
      ansible.builtin.copy:
        src: files/52minos-unattended-upgrades
        dest: /etc/apt/apt.conf.d/52minos-unattended-upgrades
        owner: root
        group: root
        mode: "0644"

    - name: Unmask APT maintenance services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: false
      loop:
        - apt-daily.service
        - apt-daily-upgrade.service
        - unattended-upgrades.service

    - name: Enable APT maintenance timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: false
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    - name: Enable unattended upgrades
      ansible.builtin.systemd_service:
        name: unattended-upgrades.service
        enabled: true
        state: started

    - name: Read the effective APT configuration
      ansible.builtin.command: apt-config dump
      register: apt_effective
      changed_when: false
      check_mode: false

    - name: Require the reviewed unattended-upgrades boundary
      ansible.builtin.assert:
        that:
          - "'APT::Periodic::Enable \"1\";' in apt_effective.stdout"
          - "'APT::Periodic::Unattended-Upgrade \"1\";' in apt_effective.stdout"
          - "'Unattended-Upgrade::Automatic-Reboot \"false\";' in apt_effective.stdout"
          - "'${distro_id}:${distro_codename}-security' in apt_effective.stdout"
      when: not ansible_check_mode

    - name: Create persistent journal storage
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: "2755"
      notify: Restart systemd-journald

    - name: Create journald override directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Bound persistent journal storage
      ansible.builtin.copy:
        src: files/90-minos-journald.conf
        dest: /etc/systemd/journald.conf.d/90-minos.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-journald

    - name: Apply journald changes before verification
      ansible.builtin.meta: flush_handlers

    - name: Flush volatile journal entries to persistent storage
      ansible.builtin.command: journalctl --flush
      changed_when: false
      when: not ansible_check_mode

    - name: Verify journal integrity
      ansible.builtin.command: journalctl --verify --quiet
      changed_when: false
      when: not ansible_check_mode

    - name: Read existing firewall status
      ansible.builtin.command:
        argv: ["ufw", "status", "numbered"]
      environment:
        LC_ALL: C
      register: ufw_before
      changed_when: false
      check_mode: false

    - name: Read configured firewall rules
      ansible.builtin.command:
        argv: ["ufw", "show", "added"]
      environment:
        LC_ALL: C
      register: ufw_added_before
      changed_when: false
      check_mode: false

    - name: Classify the existing firewall boundary
      ansible.builtin.set_fact:
        ufw_is_inactive: "{{ 'Status: inactive' in ufw_before.stdout }}"
        ufw_is_active: "{{ 'Status: active' in ufw_before.stdout }}"
        ufw_added_rules: "{{ ufw_added_before.stdout_lines | select('match', '^ufw ') | list }}"
        ufw_numbered_rules: "{{ ufw_before.stdout_lines | select('match', '^\\[\\s*[0-9]+\\]') | list }}"

    - name: Reject an unknown pre-existing firewall state
      ansible.builtin.assert:
        that:
          - ufw_is_inactive or ufw_is_active
          - not ufw_is_inactive or ufw_added_rules | length == 0
          - not ufw_is_active or ufw_added_rules | length == 1
          - not ufw_is_active or ufw_added_rules[0] == "ufw allow 22/tcp comment 'Minos SSH'"
          - not ufw_is_active or ufw_numbered_rules | length == 2
        fail_msg: Refusing to replace an unreviewed firewall rule set.

    - name: Require UFW to manage IPv6 explicitly
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: ^IPV6=
        line: IPV6=yes
        owner: root
        group: root
        mode: "0644"
      register: ufw_ipv6

    - name: Initialize the reviewed firewall boundary
      when: ufw_is_inactive and not ansible_check_mode
      block:
        - name: Set the default incoming firewall policy
          ansible.builtin.command: ufw default deny incoming
          changed_when: true

        - name: Set the default routed firewall policy
          ansible.builtin.command: ufw default deny routed
          changed_when: true

        - name: Set the default outgoing firewall policy
          ansible.builtin.command: ufw default allow outgoing
          changed_when: true

        - name: Allow SSH on IPv4 and direct global IPv6
          ansible.builtin.command: ufw allow 22/tcp comment 'Minos SSH'
          changed_when: true

        - name: Enable low-volume firewall logging
          ansible.builtin.command: ufw logging low
          changed_when: true

        - name: Enable the firewall
          ansible.builtin.command: ufw --force enable
          changed_when: true

    - name: Reload an existing firewall after an IPv6 configuration change
      ansible.builtin.command: ufw reload
      when: ufw_is_active and ufw_ipv6.changed and not ansible_check_mode
      changed_when: true

    - name: Read the effective firewall status
      ansible.builtin.command: ufw status verbose
      environment:
        LC_ALL: C
      register: ufw_effective
      changed_when: false
      check_mode: false

    - name: Read the effective numbered firewall rules
      ansible.builtin.command: ufw status numbered
      environment:
        LC_ALL: C
      register: ufw_numbered_effective
      changed_when: false
      check_mode: false

    - name: Classify the effective firewall rules
      ansible.builtin.set_fact:
        ufw_effective_rules: "{{ ufw_numbered_effective.stdout_lines | select('match', '^\\[\\s*[0-9]+\\]') | list }}"

    - name: Require the exact effective firewall boundary
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_effective.stdout"
          - "'Default: deny (incoming), allow (outgoing), deny (routed)' in ufw_effective.stdout"
          - ufw_effective_rules | length == 2
          - ufw_effective_rules[0] is match("^\\[\\s*1\\]\\s+22/tcp\\s+ALLOW IN\\s+Anywhere\\s+# Minos SSH$")
          - ufw_effective_rules[1] is match("^\\[\\s*2\\]\\s+22/tcp \\(v6\\)\\s+ALLOW IN\\s+Anywhere \\(v6\\)\\s+# Minos SSH$")
        fail_msg: The effective IPv4 and IPv6 firewall differs from the reviewed boundary.
      when: not ansible_check_mode

    - name: Inspect the prior SSH hardening drop-in
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/10-minos-hardening.conf
      register: ssh_hardening_prior

    - name: Install the candidate SSH hardening drop-in
      ansible.builtin.copy:
        src: files/10-minos-hardening.conf
        dest: /etc/ssh/sshd_config.d/10-minos-hardening.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: /usr/sbin/sshd -t -f %s
      register: ssh_hardening

    - name: Validate and activate the complete SSH configuration
      when: not ansible_check_mode
      block:
        - name: Validate all SSH configuration files
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false

        - name: Read the root connection SSH context
          ansible.builtin.command:
            argv:
              - /usr/sbin/sshd
              - -T
              - -C
              - "user=root,host={{ ansible_facts.hostname }},addr={{ ansible_facts.env.SSH_CONNECTION.split()[0] }},laddr={{ ansible_facts.default_ipv4.address }},lport=22"
          register: sshd_effective
          changed_when: false

        - name: Require the effective SSH authentication boundary
          ansible.builtin.assert:
            that:
              - "'permitrootlogin without-password' in sshd_effective.stdout"
              - "'pubkeyauthentication yes' in sshd_effective.stdout"
              - "'passwordauthentication no' in sshd_effective.stdout"
              - "'kbdinteractiveauthentication no' in sshd_effective.stdout"
              - "'authenticationmethods publickey' in sshd_effective.stdout"
              - "'allowusers root' in sshd_effective.stdout"
              - "'x11forwarding no' in sshd_effective.stdout"
              - "'allowagentforwarding no' in sshd_effective.stdout"
              - "'allowtcpforwarding no' in sshd_effective.stdout"
              - "'denyusers root' not in sshd_effective.stdout"

        - name: Reload SSH only after effective validation
          ansible.builtin.systemd_service:
            name: ssh.service
            state: reloaded
          when: ssh_hardening.changed

        - name: Prove a fresh pinned-host-key SSH login after reload
          ansible.builtin.command: &fresh_ssh_login
            argv:
              - ssh
              - -o
              - ControlMaster=no
              - -o
              - ControlPath=none
              - -o
              - BatchMode=yes
              - -o
              - ConnectTimeout=20
              - -o
              - StrictHostKeyChecking=yes
              - -o
              - "UserKnownHostsFile={{ playbook_dir }}/known_hosts"
              - -o
              - GlobalKnownHostsFile=/dev/null
              - -o
              - KnownHostsCommand=none
              - -o
              - VerifyHostKeyDNS=no
              - -o
              - UpdateHostKeys=no
              - -o
              - CheckHostIP=no
              - -o
              - HostKeyAlgorithms=ssh-ed25519
              - -o
              - IdentitiesOnly=yes
              - -o
              - PreferredAuthentications=publickey
              - -o
              - HostbasedAuthentication=no
              - -o
              - KbdInteractiveAuthentication=no
              - -o
              - PasswordAuthentication=no
              - -i
              - "{{ lookup('env', 'HOME') }}/.ssh/minos_mikrus_ed25519"
              - -p
              - "{{ ansible_port | default(22) | string }}"
              - "{{ ansible_user | default('root') }}@{{ ansible_host | default(inventory_hostname) }}"
              - /usr/bin/true
          delegate_to: localhost
          become: false
          changed_when: false
          when: ssh_hardening.changed

      rescue:
        - name: Restore the prior SSH drop-in
          ansible.builtin.copy:
            src: "{{ ssh_hardening.backup_file }}"
            dest: /etc/ssh/sshd_config.d/10-minos-hardening.conf
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: ssh_hardening.backup_file is defined

        - name: Remove a rejected first SSH drop-in
          ansible.builtin.file:
            path: /etc/ssh/sshd_config.d/10-minos-hardening.conf
            state: absent
          when:
            - ssh_hardening.changed
            - not ssh_hardening_prior.stat.exists
            - ssh_hardening.backup_file is not defined

        - name: Validate the restored SSH configuration
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false

        - name: Reload the restored SSH configuration
          ansible.builtin.systemd_service:
            name: ssh.service
            state: reloaded
          when: ssh_hardening.changed

        - name: Prove a fresh pinned-host-key SSH login after rollback
          ansible.builtin.command: *fresh_ssh_login
          delegate_to: localhost
          become: false
          changed_when: false
          when: ssh_hardening.changed

        - name: Stop after restoring the prior SSH configuration
          ansible.builtin.fail:
            msg: Rejected the candidate SSH boundary and restored the prior configuration.

    # reset_connection ignores inherited block conditions, so keep it outside.
    - name: Drop the multiplexed SSH connection after validation
      ansible.builtin.meta: reset_connection

    - name: Detect a required reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report required reboot without performing it
      ansible.builtin.debug:
        msg: A reboot is required and must be performed through a controlled Mikr.us maintenance step.
      when: reboot_required.stat.exists

  handlers:
    - name: Restart systemd-journald
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted

    - name: Restart Docker
      ansible.builtin.systemd_service:
        name: docker.service
        state: restarted
      when: not ansible_check_mode
