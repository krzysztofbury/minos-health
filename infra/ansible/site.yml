        minos_cloudflared_boundary: "{{ minos_container_boundaries.results[1].stdout.split('|') }}"
        minos_uptime_kuma_boundary: "{{ minos_container_boundaries.results[2].stdout.split('|') }}"
        minos_watcher_boundary: "{{ minos_container_boundaries.results[3].stdout.split('|') }}"
