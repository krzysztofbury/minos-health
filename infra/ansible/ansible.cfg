[defaults]
inventory = inventory/production.yml
host_key_checking = True
interpreter_python = auto_silent
private_key_file = ~/.ssh/minos_mikrus_ed25519
retry_files_enabled = False
timeout = 20

[ssh_connection]
ssh_args = -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=yes -o UserKnownHostsFile=infra/ansible/known_hosts -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o KbdInteractiveAuthentication=no -o PasswordAuthentication=no
pipelining = True
