pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_static on;
    gzip_types application/json;
    gzip_vary on;
    keepalive_timeout 15;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 8080;
        server_name minoshealth.pl;
        root /usr/share/nginx/html;

        # Reject raw forms that Nginx could normalize into an allowed location.
        if ($request_uri ~ "%") {
            return 404;
        }
        if ($request_uri ~ "//") {
            return 404;
        }
        if ($request_uri ~ "\.\.") {
            return 404;
        }
        if ($request_uri ~ "(^|/)\.(/|$)") {
            return 404;
        }
        if ($request_uri ~* "^/api/v1/artifacts") {
            return 404;
        }

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://plausible.io; connect-src 'self' https://plausible.io; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","mode":"maintenance"}';
        }

        location = /readyz {
            default_type application/json;
            return 503 '{"status":"not_ready","mode":"maintenance"}';
        }

        location = /api/v1/provenance/rsk {
            if ($request_uri != "/api/v1/provenance/rsk") {
                return 404;
            }
            root /var/lib/minos/public;
            default_type application/json;
            try_files /current/api/v1/provenance/rsk.json =404;
        }

        location = /api/v1/provenance/baw {
            if ($request_uri != "/api/v1/provenance/baw") {
                return 404;
            }
            root /var/lib/minos/public/baw;
            default_type application/json;
            try_files /current/api/v1/provenance/baw.json =404;
        }

        location ^~ /api/v1/artifacts/ {
            return 404;
        }

        location = /polityka-prywatnosci {
            try_files /privacy-policy.html =404;
        }

        location = /regulamin {
            try_files /terms.html =404;
        }

        location = /zrodla {
            if ($request_uri != "/zrodla") {
                return 404;
            }
            try_files /sources.html =404;
        }

        location = / {
            try_files /index.html =404;
        }

        location = /legal.css {
            try_files /legal.css =404;
        }

        location = /home.css {
            if ($request_uri != "/home.css") {
                return 404;
            }
            try_files /home.css =404;
        }

        location = /plausible-init.js {
            try_files /plausible-init.js =404;
        }

        location = /sources.css {
            if ($request_uri != "/sources.css") {
                return 404;
            }
            try_files /sources.css =404;
        }

        location = /sources.js {
            if ($request_uri != "/sources.js") {
                return 404;
            }
            try_files /sources.js =404;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name minoshealth.com;

        location = / {
            return 308 https://minoshealth.pl/;
        }

        location = /polityka-prywatnosci {
            return 308 https://minoshealth.pl/polityka-prywatnosci;
        }

        location = /regulamin {
            return 308 https://minoshealth.pl/regulamin;
        }

        location = /zrodla {
            if ($request_uri != "/zrodla") {
                return 404;
            }
            return 308 https://minoshealth.pl/zrodla;
        }

        location / {
            return 404;
        }
    }
}
