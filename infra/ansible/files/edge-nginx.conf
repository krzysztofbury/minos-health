pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_static on;
    gzip_types application/json application/javascript application/xml image/svg+xml text/css text/markdown text/plain;
    gzip_vary on;
    keepalive_timeout 15;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Public pages and static assets revalidate (allowing back/forward cache);
    # API answers and provenance projections stay uncacheable by default.
    map $request_uri $minos_cache_route {
        default "no-store";
        ~^/(|slowniki|slowniki/icd-10|slowniki/icd-9|zrodla|polityka-prywatnosci|regulamin)$ "no-cache";
        ~^/(site\.css|request\.js|search\.js|dictionary\.js|jgp\.js|sources\.js|plausible-init\.js|favicon\.svg|social-preview-v1\.png|robots\.txt|llms\.txt|sitemap\.xml|sitemap-pages\.xml)$ "no-cache";
        # JGP pages and API set their own Cache-Control: public when fixed per
        # bundle, no-store for errors and today-redirects.
        ~^/jgp(/|$|\?) "upstream";
        ~^/api/v1/jgp/ "upstream";
        # The dictionaries are fixed per bundle; the API sets public caching (#155).
        ~^/api/v1/grouping/dictionaries$ "upstream";
        ~^/fonts/ "public, max-age=604800";
        ~^/slowniki/icd-(10|9)/ "upstream";
        ~^/sitemap-icd-(10|9)\.xml$ "public, max-age=3600";
    }

    # An "upstream" route adds nothing when the application sent its own
    # Cache-Control (an empty value adds no header), but the edge's own
    # refusals (a query string, an unlisted path) have none and stay no-store.
    map "$minos_cache_route:$upstream_http_cache_control" $minos_cache_control {
        default $minos_cache_route;
        "~^upstream:." "";
        "upstream:" "no-store";
    }

    server {
        listen 8080 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 8080;
        server_name minoshealth.pl;
        root /usr/share/nginx/html;

        # Reject raw forms that Nginx could normalize into an allowed location.
        if ($request_uri ~ "%") {
            return 404;
        }
        if ($request_uri ~ "//") {
            return 404;
        }
        if ($request_uri ~ "\.\.") {
            return 404;
        }
        if ($request_uri ~ "(^|/)\.(/|$)") {
            return 404;
        }
        if ($request_uri ~* "^/api/v1/artifacts") {
            return 404;
        }

        add_header Cache-Control $minos_cache_control always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://plausible.io; connect-src 'self' https://plausible.io; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","mode":"maintenance"}';
        }

        location = /readyz {
            default_type application/json;
            return 503 '{"status":"not_ready","mode":"maintenance"}';
        }

        location = /api/v1/provenance/rsk {
            if ($request_uri != "/api/v1/provenance/rsk") {
                return 404;
            }
            root /var/lib/minos/public;
            default_type application/json;
            try_files /current/api/v1/provenance/rsk.json =404;
        }

        location = /api/v1/provenance/baw {
            if ($request_uri != "/api/v1/provenance/baw") {
                return 404;
            }
            root /var/lib/minos/public/baw;
            default_type application/json;
            try_files /current/api/v1/provenance/baw.json =404;
        }

        location ^~ /api/v1/artifacts/ {
            return 404;
        }

        location = /api/v1/provenance/nfz {
            if ($request_uri != "/api/v1/provenance/nfz") {
                return 404;
            }
            root /var/lib/minos/public/nfz;
            default_type application/json;
            try_files /current/api/v1/provenance/nfz.json =404;
        }

        location = /polityka-prywatnosci {
            try_files /privacy-policy.html =404;
        }

        location = /regulamin {
            try_files /terms.html =404;
        }

        location = /zrodla {
            if ($request_uri != "/zrodla") {
                return 404;
            }
            try_files /sources.html =404;
        }

        location = /favicon.svg {
            if ($request_uri != "/favicon.svg") {
                return 404;
            }
            default_type image/svg+xml;
            return 200 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><title>Minos Health</title><rect width="32" height="32" rx="7" fill="#0a5c6e"/><path d="M7 24V8h4.6L16 16.4 20.4 8H25v16h-4.2v-9L16 23.6 11.2 15v9z" fill="#ffffff"/></svg>';
        }

        location = /favicon.ico {
            if ($request_uri != "/favicon.ico") {
                return 404;
            }
            return 308 https://minoshealth.pl/favicon.svg;
        }

        location = / {
            try_files /index.html =404;
        }

        location = /szukaj {
            return 308 https://minoshealth.pl/;
        }

        location = /site.css {
            if ($request_uri != "/site.css") {
                return 404;
            }
            # The maintenance runtime deploys the shared stylesheet as legal.css.
            try_files /site.css /legal.css =404;
        }

        location = /plausible-init.js {
            try_files /plausible-init.js =404;
        }

        location = /sources.js {
            if ($request_uri != "/sources.js") {
                return 404;
            }
            try_files /sources.js =404;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name minoshealth.com www.minoshealth.com;

        location = / {
            return 308 https://minoshealth.pl/;
        }

        location = /polityka-prywatnosci {
            return 308 https://minoshealth.pl/polityka-prywatnosci;
        }

        location = /regulamin {
            return 308 https://minoshealth.pl/regulamin;
        }

        location = /szukaj {
            return 308 https://minoshealth.pl/;
        }

        location = /zrodla {
            if ($request_uri != "/zrodla") {
                return 404;
            }
            return 308 https://minoshealth.pl/zrodla;
        }

        location / {
            return 404;
        }
    }
}
