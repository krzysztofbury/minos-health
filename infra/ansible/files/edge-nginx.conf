pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 8080;
        server_name minoshealth.pl;
        root /usr/share/nginx/html;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://plausible.io; connect-src https://plausible.io; style-src 'self' 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","mode":"maintenance"}';
        }

        location = /readyz {
            default_type application/json;
            return 503 '{"status":"not_ready","mode":"maintenance"}';
        }

        location = /polityka-prywatnosci {
            try_files /privacy-policy.html =404;
        }

        location = /regulamin {
            try_files /terms.html =404;
        }

        location = / {
            try_files /index.html =404;
        }

        location = /legal.css {
            try_files /legal.css =404;
        }

        location = /plausible-init.js {
            try_files /plausible-init.js =404;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name minoshealth.com;

        location = / {
            return 308 https://minoshealth.pl/;
        }

        location = /polityka-prywatnosci {
            return 308 https://minoshealth.pl/polityka-prywatnosci;
        }

        location = /regulamin {
            return 308 https://minoshealth.pl/regulamin;
        }

        location / {
            return 404;
        }
    }
}
