[project]
name = "minos-health"
version = "0.0.1"
description = "Explainable settlement intelligence for Polish hospital care"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT OR Apache-2.0"
dependencies = [
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "httpx>=0.28.0",
  "loguru>=0.7.3",
  "backoff>=2.2.1",
]

[project.scripts]
minos = "minos.cli.main:main"

[dependency-groups]
dev = ["basedpyright>=1.31", "mypy>=1.17", "pytest>=8.4", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minos"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
