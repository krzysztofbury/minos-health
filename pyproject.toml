[project]
name = "minos-health"
version = "0.0.1"
description = "Explainable settlement intelligence for Polish hospital care"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT OR Apache-2.0"
dependencies = [
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "httpx>=0.28.0",
  "loguru>=0.7.3",
  "backoff>=2.2.1",
]

[project.scripts]
minos = "minos.cli.main:main"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9,<2",
    "basedpyright>=1.31",
    "hatchling==1.32.0",
    "mypy>=1.17",
    "pip-audit>=2.9,<3",
    "pip-licenses>=5,<6",
    "pre-commit>=4.6,<5",
    "pytest>=8.4",
    "pyyaml>=6,<7",
    "ruff>=0.12",
    "types-pyyaml>=6,<7",
    "zizmor>=1.30,<2",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minos"]

[tool.hatch.build.targets.wheel.force-include]
"database/control/sqlite" = "minos/database/control/sqlite"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
