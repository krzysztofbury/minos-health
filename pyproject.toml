[project]
name = "minos-health"
version = "0.0.1"
description = "Explainable settlement intelligence for Polish hospital care"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT OR Apache-2.0"
dependencies = [
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "httpx>=0.28.0",
  "loguru>=0.7.3",
  "backoff>=2.2.1",
  "apscheduler>=3.11,<3.12",
  "boto3>=1.40,<2",
  "botocore>=1.40,<2",
  "defusedxml>=0.7.1,<1",
  "rapidfuzz>=3.14.6,<4",
]

[project.scripts]
minos = "minos.cli.main:main"

[project.optional-dependencies]
reference = ["morfeusz2==1.99.15", "openpyxl==3.1.5"]
api = ["fastapi==0.148.0", "uvicorn==0.54.0", "mcp==2.3.0"]
dictionary-tools = ["wn==1.1.1"]

[dependency-groups]
dev = [
    "fastapi==0.148.0",
    "uvicorn==0.54.0",
    "mcp==2.3.0",
    "httpx2==2.14.0",
    "morfeusz2==1.99.15",
    "openpyxl==3.1.5",
    "bandit[toml]>=1.9,<2",
    "basedpyright>=1.31",
    "hatchling==1.32.4",
    "mypy>=1.17",
    "pip-audit>=2.9,<3",
    "pip-licenses>=5,<6",
    "pre-commit>=4.6,<5",
    "pytest>=8.4",
    "pyyaml>=6,<7",
    "ruff>=0.12",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl==3.1.5.20261017",
    "types-pyyaml>=6,<7",
    "zizmor>=1.30,<2",
    "hypothesis>=6,<7",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minos"]

[tool.hatch.build.targets.wheel.force-include]
"database/control/sqlite" = "minos/database/control/sqlite"
"database/reference/sqlite" = "minos/database/reference/sqlite"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "rsk_live: explicit opt-in compatibility test for an ignored private RSK capture",
  "icd9_live: explicit opt-in compatibility test for privately archived pinned NFZ ICD-9 evidence",
  "jgp_live: explicit opt-in compatibility test for privately archived pinned NFZ JGP catalog workbooks",
]

[tool.ruff]
target-version = "py314"
# Runs on the production host's system Python, not the project runtime.
per-file-target-version = { "scripts/validation_host.py" = "py312", "scripts/watcher_host.py" = "py312", "scripts/measure_reference_host.py" = "py312", "scripts/processor_host.py" = "py312" }

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
