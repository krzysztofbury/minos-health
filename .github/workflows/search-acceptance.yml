name: Evaluate pinned offline search

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Full gold search report
    if: github.repository == 'krzysztofbury/minos-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          checksum: 788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21

      - name: Build pinned search bundle without activating it
        run: |
          set -euo pipefail
          uv sync --locked --all-groups --python 3.14.7
          uv run python -m scripts.compose_conditions_manifest \
            --search-profile polish-folded-1 \
            --synonyms manifests/sources/search-synonyms-reviewed-v1.json \
            --output "$RUNNER_TEMP/search-manifest.json"
          uv run python -m scripts.fetch_search_evaluation_sources \
            --manifest "$RUNNER_TEMP/search-manifest.json" \
            --archive-root "$RUNNER_TEMP/search-archive"
          uv run python -m minos data build \
            --manifest "$RUNNER_TEMP/search-manifest.json" \
            --archive-root "$RUNNER_TEMP/search-archive" \
            --output "$RUNNER_TEMP/search-bundle" --json

      - name: Evaluate active rewrites in both offline engines
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/search-reports"
          status=0
          for index in auto portable; do
            uv run python -m scripts.evaluate_search \
              --bundle "$RUNNER_TEMP/search-bundle" --index "$index" \
              --gate-reviewed > "$RUNNER_TEMP/search-reports/$index.json" || status=1
            uv run python -m scripts.evaluate_search_safety \
              --bundle "$RUNNER_TEMP/search-bundle" --index "$index" \
              > "$RUNNER_TEMP/search-reports/safety-$index.json" || status=1
          done
          uv run python -m scripts.evaluate_jgp_search \
            --bundle "$RUNNER_TEMP/search-bundle" \
            --output "$RUNNER_TEMP/search-reports/jgp.json" || status=1
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          fixtures = ['tests/evaluation/search-gold-v1.json',
                      'tests/evaluation/search-safety-v1.json',
                      'tests/fixtures/jgp-search-gold.json']
          record = {'source_revision': os.environ['GITHUB_SHA'],
                    'run_id': os.environ['GITHUB_RUN_ID'],
                    'fixture_sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                                       for name in fixtures}}
          path = Path(os.environ['RUNNER_TEMP']) / 'search-reports/identity.json'
          path.write_text(json.dumps(record, indent=2) + '\n')
          PY
          exit "$status"

      - name: Retain only query-free evaluation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-gold-reports
          path: ${{ runner.temp }}/search-reports/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove licensed inputs and generated bundle
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/search-archive" "$RUNNER_TEMP/search-bundle"
          rm -f -- "$RUNNER_TEMP/search-manifest.json"
