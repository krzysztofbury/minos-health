name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SKIP: no-commit-to-branch
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.7"
          checksum: 788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14.7

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.14.7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Initialize Terraform providers
        run: terraform -chdir=infra/bootstrap init -backend=false -lockfile=readonly

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Scan complete Git history for secrets
        run: uv run pre-commit run gitleaks-history --hook-stage manual --all-files

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Validate Terraform
        run: terraform -chdir=infra/bootstrap validate

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: infra
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

      - name: Build package
        run: uv build --no-sources

      - name: Smoke test built wheel
        run: |
          smoke_dir="$(mktemp -d)"
          uv export --frozen --no-dev --no-emit-project \
            --output-file "$smoke_dir/requirements.txt"
          uv venv "$smoke_dir/venv" --python 3.14.7
          uv pip install --python "$smoke_dir/venv/bin/python" \
            --requirements "$smoke_dir/requirements.txt"
          uv pip install --python "$smoke_dir/venv/bin/python" \
            --no-deps dist/*.whl
          uv pip check --python "$smoke_dir/venv/bin/python"
          "$smoke_dir/venv/bin/minos" --version
          "$smoke_dir/venv/bin/python" - <<'PY'
          import sqlite3
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from minos.ingest.watchers.control import (
              ControlStore,
              SourceConfiguration,
              SourceSchedule,
              apply_control_migrations,
          )

          connection = sqlite3.connect(":memory:", isolation_level=None)
          result = apply_control_migrations(connection)
          assert result.schema_version == 1
          assert connection.execute("PRAGMA integrity_check").fetchone() == ("ok",)

          with TemporaryDirectory() as directory:
              store = ControlStore.open(Path(directory) / "control.sqlite3")
              configured = store.configure_source(
                  SourceConfiguration("rsk", "rsk", {}, True)
              )
              scheduled = store.set_schedule(
                  SourceSchedule("rsk", "0 3 * * *", 300, 3, 0.5, 30.0)
              )
              assert configured.configuration_revision == 1
              assert scheduled.next_due_at_ms > 0
              store.close()
          PY
