name: CI

# A main push always runs full CI and is never cancelled: deploy tooling takes
# its success as evidence for that exact commit (#272).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A queued run in the same group is cancelled even without
  # cancel-in-progress, so each main push gets its own group.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SKIP: no-commit-to-branch
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14.7

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.14.7

      - name: Classify the complete change set
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD: ${{ github.sha }}
        run: uv run python -m scripts.ci_scope

      - name: Validate host materializer safety boundary
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run pytest tests/unit/test_materialize_ansible_host.py

      - name: Syntax-check the production Ansible playbook
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          uvx --from ansible-core==2.21.4 ansible-playbook \
            infra/ansible/site.yml --syntax-check \
            -e expected_hostname=minos-ci \
            -e cloudflared_tunnel_id=11111111-2222-3333-4444-555555555555 \
            -e watcher_archive_backend=s3 \
            -e watcher_s3_bucket=minos-ci-fixture \
            -e watcher_s3_endpoint=https://0123456789abcdef0123456789abcdef.eu.r2.cloudflarestorage.com \
            -e watcher_expected_image_digest=sha256:${SYNTHETIC_DIGEST_HEX} \
            -e watcher_source_revision=${GITHUB_SHA}
          uvx --from ansible-core==2.21.4 ansible-playbook \
            infra/ansible/processor.yml --syntax-check \
            -e expected_hostname=minos-ci
          uvx --from ansible-core==2.21.4 ansible-playbook \
            infra/ansible/ssh-tailnet.yml --syntax-check \
            -e expected_hostname=minos-ci -e ssh_tailnet_stage=join
        env:
          ANSIBLE_CONFIG: infra/ansible/ansible.cfg
          SYNTHETIC_DIGEST_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Render and validate the production runtime configuration
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          uvx --from ansible-core==2.21.4 ansible localhost \
            --inventory localhost, --connection local \
            --module-name ansible.builtin.template \
            --args "src=${GITHUB_WORKSPACE}/infra/ansible/templates/minos-compose.yml.j2 dest=${RUNNER_TEMP}/minos-compose.yaml" \
            --extra-vars '{"cloudflared_credential_path":"/etc/minos/cloudflared/11111111-2222-3333-4444-555555555555.json","uptime_kuma_gid":10003,"uptime_kuma_image_reference":"docker.io/louislam/uptime-kuma@sha256:970f01d661de548b88c7e6012d3574666d033b1de6a323fc1bebfc3cb3b4c437","uptime_kuma_uid":10003,"watcher_archive_backend":"s3","watcher_expected_image_digest":"sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","watcher_gid":10001,"watcher_image_repository":"ghcr.io/example/minos-health-watcher","watcher_runtime_image_digest":"sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","watcher_s3_bucket":"minos-ci-fixture","watcher_s3_endpoint":"https://0123456789abcdef0123456789abcdef.eu.r2.cloudflarestorage.com","watcher_secrets_gid":10002,"watcher_uid":10001,"watcher_uptime_kuma_required":false}'
          for exposure in public tailnet; do
            uvx --from ansible-core==2.21.4 ansible localhost \
              --inventory localhost, --connection local \
              --module-name ansible.builtin.template \
              --args "src=${GITHUB_WORKSPACE}/infra/ansible/templates/10-minos-hardening.conf.j2 dest=${RUNNER_TEMP}/sshd-${exposure}.conf" \
              --extra-vars "ssh_exposure=${exposure}"
          done
          # Public SSH keeps no listen override; a tailnet host listens on loopback only (#227).
          if grep -q ListenAddress "${RUNNER_TEMP}/sshd-public.conf"; then exit 1; fi
          test "$(grep -c '^ListenAddress' "${RUNNER_TEMP}/sshd-tailnet.conf")" = 2
          uvx --from ansible-core==2.21.4 ansible localhost \
            --inventory localhost, --connection local \
            --module-name ansible.builtin.template \
            --args "src=${GITHUB_WORKSPACE}/infra/ansible/templates/cloudflared-config.yml.j2 dest=${RUNNER_TEMP}/cloudflared-config.yml" \
            --extra-vars '{"cloudflared_tunnel_id":"11111111-2222-3333-4444-555555555555","uptime_kuma_public_status_enabled":false}'
          uvx --from ansible-core==2.21.4 ansible localhost \
            --inventory localhost, --connection local \
            --module-name ansible.builtin.template \
            --args "src=${GITHUB_WORKSPACE}/infra/ansible/templates/cloudflared-config.yml.j2 dest=${RUNNER_TEMP}/cloudflared-public-status-config.yml" \
            --extra-vars '{"cloudflared_tunnel_id":"11111111-2222-3333-4444-555555555555","uptime_kuma_public_status_enabled":true}'
          docker compose --file "$RUNNER_TEMP/minos-compose.yaml" config --quiet
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/cloudflared-config.yml:/etc/cloudflared/config.yml:ro" \
            docker.io/cloudflare/cloudflared@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515 \
            tunnel --config /etc/cloudflared/config.yml ingress validate
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/cloudflared-public-status-config.yml:/etc/cloudflared/config.yml:ro" \
            docker.io/cloudflare/cloudflared@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515 \
            tunnel --config /etc/cloudflared/config.yml ingress validate

      - name: Verify the production systemd unit
        if: steps.scope.outputs.docs_only != 'true'
        run: systemd-analyze verify infra/ansible/files/minos-compose.service

      - name: Simulate deployment schema incompatibility
        if: steps.scope.outputs.docs_only != 'true'
        run: >-
          uv run pytest tests/unit/test_watcher_runtime.py
          -k deployment_copy_rejects_schema_mismatch

      - name: Run pre-commit checks
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Check changed documentation
        if: steps.scope.outputs.docs_only == 'true'
        env:
          BASE: ${{ steps.scope.outputs.base }}
          HEAD: ${{ steps.scope.outputs.head }}
        run: uv run pre-commit run --from-ref "$BASE" --to-ref "$HEAD" --show-diff-on-failure

      - name: Verify pinned catalog search asset
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run python scripts/build_catalog_assets.py --check

      - name: Verify rendered site pages
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run python scripts/build_site.py --check

      - name: Install cosign
        if: steps.scope.outputs.docs_only != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The owner publishes server.json by hand (docs/v0.0.1/operations.md);
      # CI proves the registry accepts it with the same verified publisher.
      - name: Validate the MCP Registry listing
        if: steps.scope.outputs.docs_only != 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.5
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL -o "$RUNNER_TEMP/$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RUNNER_TEMP/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate server.json

      - name: Scan complete Git history for secrets
        run: uv run pre-commit run gitleaks-history --hook-stage manual --all-files

      - name: Audit Python dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run pip-audit

      - name: Scan infrastructure configuration
        if: steps.scope.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

      - name: Build package
        if: steps.scope.outputs.docs_only != 'true'
        run: uv build --no-sources

      - name: Smoke test built wheel
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          smoke_dir="$(mktemp -d)"
          uv export --frozen --no-dev --extra reference --no-emit-project \
            --output-file "$smoke_dir/requirements.txt"
          uv venv "$smoke_dir/venv" --python 3.14.7
          uv pip install --python "$smoke_dir/venv/bin/python" \
            --requirements "$smoke_dir/requirements.txt"
          uv pip install --python "$smoke_dir/venv/bin/python" \
            --no-deps dist/*.whl
          uv pip check --python "$smoke_dir/venv/bin/python"
          "$smoke_dir/venv/bin/minos" --version
          "$smoke_dir/venv/bin/python" - <<'PY'
          import sqlite3
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from minos.ingest.icd10 import parse_icd10
          from minos.ingest.reference_artifact import build_reference_artifact
          from minos.ingest.reference_manifest import DatasetManifest
          from minos.store.reference import open_reference
          from tests.fixtures.icd9_workbook import archive_bytes, workbook_manifest
          from tests.fixtures.icd9_xml import XML, source_manifest

          from minos.ingest.watchers.control import (
              CONTROL_SCHEMA_VERSION,
              apply_control_migrations,
          )

          connection = sqlite3.connect(":memory:", isolation_level=None)
          result = apply_control_migrations(connection)
          assert result.schema_version == CONTROL_SCHEMA_VERSION
          assert connection.execute("PRAGMA integrity_check").fetchone() == ("ok",)
          connection.close()

          manifest = DatasetManifest.model_validate_json(
              Path("manifests/sources/icd10-synthetic.json").read_bytes()
          )
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              blob = root / "blobs" / "sha256" / manifest.sources[0].sha256
              blob.parent.mkdir(parents=True)
              blob.write_bytes(Path("tests/fixtures/icd10-pl/minimal.xml").read_bytes())
              with blob.open("rb") as source:
                  assert len(tuple(parse_icd10(source))) == 18
              result = build_reference_artifact(manifest, root, root / "bundle")
              assert result.row_counts["reference_node"] == 10
              with open_reference(root / "bundle") as reader:
                  assert reader.concept(manifest.sources[0].release_id, "E11.0") is not None
                  assert len(reader.hierarchy(manifest.sources[0].release_id, 3)) == 4
              command = [str(Path(sys.executable).with_name("minos")), "search",
                         "--system", "icd10-pl", "--query", "E11.0",
                         "--data", str(root / "bundle"), "--json"]
              for index in ("auto", "portable"):
                  searched = subprocess.run(command + ["--index", index],
                                            cwd=root, capture_output=True, text=True,
                                            timeout=10, check=True)
                  answer = json.loads(searched.stdout)
                  assert answer["version"] == 1
                  assert answer["results"][0]["code"] == "E11.0"
                  assert answer["results"][0]["match_type"] == "exact_code"
                  assert answer["release_id"] == manifest.sources[0].release_id
                  assert answer["database_sha256"] == result.database_sha256
              workbook = archive_bytes()
              companions = ((source_manifest(), XML), (workbook_manifest(workbook), workbook))
              for source, body in companions:
                  (blob.parent / source.sha256).write_bytes(body)
              combined = manifest.model_copy(update={"sources": (*manifest.sources, *(source for source, _ in companions))})
              mixed = build_reference_artifact(combined, root, root / "mixed")
              assert mixed.row_counts["source_release"] == 3
              assert mixed.row_counts["concept"] == 15
              for source, _ in companions:
                  searched = subprocess.run([str(Path(sys.executable).with_name("minos")), "search",
                      "--system", "icd9-pl", "--release", source.release_id, "--query", "A01",
                      "--data", str(root / "mixed"), "--json"],
                      cwd=root, capture_output=True, text=True, timeout=10, check=True)
                  hit = json.loads(searched.stdout)["results"][0]
                  assert hit["code"] == "A01"
                  if source.origin == "czs":
                      assert hit["source_attributes"]["status"] == "N"
                  else:
                      assert hit["source_attributes"]["worksheet"] == "ICD-9_PL "
                      assert len(hit["context"]["edges"]) == 2
          PY

      - name: Build and exercise the standalone offline reference CLI
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          bash scripts/build_standalone_cli.sh "$RUNNER_TEMP/standalone"
          docker pull debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
          uv run python scripts/smoke_standalone_cli.py "$RUNNER_TEMP/standalone/build/dist/minos"

      - name: Build and exercise the watcher container and Compose runtime
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --file compose.yaml down --volumes --remove-orphans
          }
          trap cleanup EXIT

          docker compose --file compose.yaml config --quiet
          docker build --platform linux/amd64 --target watcher \
            --provenance=false \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag minos-health-watcher:local .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' minos-health-watcher:local)" = "linux/amd64"
          docker run --rm --platform linux/amd64 --network none --read-only \
            --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges \
            minos-health-watcher:local --version
          docker compose --file compose.yaml --profile bootstrap run --rm --no-deps \
            watcher-bootstrap-rsk
          docker compose --file compose.yaml run --rm --no-deps \
            --entrypoint /app/.venv/bin/python watcher -c \
            "from pathlib import Path; p=Path('/var/lib/minos/staging/.minos-blob-ci-stale'); p.write_bytes(b'partial'); p.chmod(0o600)"
          docker compose --file compose.yaml --profile preflight run --rm --no-deps \
            watcher-preflight
          docker compose --file compose.yaml up --detach --no-build \
            --wait --wait-timeout 60 watcher
          sleep 15

          container_id="$(docker compose --file compose.yaml ps --quiet watcher)"
          test -n "$container_id"
          docker inspect "$container_id" > "$RUNNER_TEMP/watcher-inspect.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          inspected = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "watcher-inspect.json").read_text()
          )[0]
          host = inspected["HostConfig"]
          config = inspected["Config"]
          state = inspected["State"]
          assert state["Status"] == "running"
          assert state["Health"]["Status"] == "healthy"
          assert inspected["RestartCount"] == 0
          assert inspected["Platform"] == "linux"
          assert config["Labels"]["org.opencontainers.image.revision"] == os.environ[
              "GITHUB_SHA"
          ]
          assert config["User"] == "10001:10001"
          assert config["Entrypoint"] == ["/app/.venv/bin/minos"]
          assert config["Cmd"] == ["watcher", "run"]
          assert not config.get("ExposedPorts")
          assert not host.get("PortBindings")
          assert host["ReadonlyRootfs"] is True
          assert host["CapDrop"] == ["ALL"]
          assert host["SecurityOpt"] == ["no-new-privileges:true"]
          assert host["PidsLimit"] == 64
          assert host["Memory"] == 805306368
          assert host["NanoCpus"] == 750000000
          destinations = {mount["Destination"] for mount in inspected["Mounts"]}
          assert destinations == {
              "/var/lib/minos/archive",
              "/var/lib/minos/control",
              "/var/lib/minos/public",
              "/var/lib/minos/staging",
          }
          PY
          docker compose --file compose.yaml exec --no-TTY watcher \
            /app/.venv/bin/python -c \
            "from pathlib import Path; assert not Path('/var/lib/minos/staging/.minos-blob-ci-stale').exists()"

      - name: Verify watcher-only activation and partial-failure rollback
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          smoke_root="$(mktemp -d)"
          trap 'find "$smoke_root" -type d -exec chmod u+rwx {} +; rm -rf "$smoke_root"' EXIT
          uv run python -m scripts.smoke_watcher_deploy "$smoke_root/host"

      - name: Verify tunnel-only recovery and rollback with Docker Compose
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          uv run python -m scripts.smoke_tunnel_deploy "$smoke_root/host"

      - name: Verify Uptime Kuma release recovery and data rollback with Docker Compose
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          uv run python -m scripts.smoke_kuma_deploy "$smoke_root/host"

      - name: Scan the final watcher image
        if: steps.scope.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: minos-health-watcher:local
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
