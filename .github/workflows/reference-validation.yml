name: Verify and publish reference validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify validation containers and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image_artifact_id: ${{ steps.tested-images.outputs.artifact-id }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          checksum: 788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.14.7

      - name: Classify the complete change set
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD: ${{ github.sha }}
        run: uv run python -m scripts.ci_scope

      - name: Record documentation-only validation
        if: steps.scope.outputs.docs_only == 'true'
        run: echo 'Documentation-only change; document and history-secret checks run in CI.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install browser driver runtime
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"

      - name: Verify browser startup race and failure handling
        if: steps.scope.outputs.docs_only != 'true'
        run: node --test tests/browser/devtools-port.test.mjs

      - name: Build and exercise validation images using synthetic data only
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          uv run python scripts/build_validation_edge.py "$RUNNER_TEMP/edge-artifacts"
          docker build --platform linux/amd64 --provenance=false \
            --file packaging/api/Dockerfile --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag minos-reference-api:validation-local .
          docker build --platform linux/amd64 --provenance=false \
            --file packaging/validation-edge/Dockerfile \
            --build-context "edge-artifacts=$RUNNER_TEMP/edge-artifacts" \
            --build-arg "VCS_REF=$GITHUB_SHA" --tag minos-reference-edge:validation-local .
          uv run python scripts/smoke_reference_web.py "$RUNNER_TEMP/reference-smoke" \
            --chromium "$(command -v google-chrome)"
          uv run python scripts/smoke_grouping_web.py "$RUNNER_TEMP/grouping-smoke" \
            --api-image minos-reference-api:validation-local \
            --edge-image minos-reference-edge:validation-local \
            --chromium "$(command -v google-chrome)"
          uv run python scripts/smoke_validation_rollback.py "$RUNNER_TEMP/rollback-smoke"

      - name: Scan validation API for fixable high/critical vulnerabilities
        if: steps.scope.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: minos-reference-api:validation-local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Scan validation edge for fixable high/critical vulnerabilities
        if: steps.scope.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: minos-reference-edge:validation-local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Export the tested image identities
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'krzysztofbury/minos-health'
        run: uv run python -m scripts.validation_images export "$RUNNER_TEMP/tested-images"

      - name: Transfer tested images to the publisher
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'krzysztofbury/minos-health'
        id: tested-images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-validation-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-images/
          if-no-files-found: error
          compression-level: 1 # Hosted docker save includes compressible layers.
          retention-days: 1

  publish:
    name: Publish private validation images
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'krzysztofbury/minos-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # Private validation code/static images, never datasets.
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          checksum: 788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21

      - name: Install locked publisher dependencies
        run: uv sync --locked --no-dev --python 3.14.7

      - name: Require the exact artifact ID
        env:
          IMAGE_ARTIFACT_ID: ${{ needs.verify.outputs.image_artifact_id }}
        run: '[[ "$IMAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Download this verification job's immutable image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.image_artifact_id }}
          path: ${{ runner.temp }}/tested-images
          digest-mismatch: error

      - name: Authenticate to private GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish exactly the tested validation images
        run: >-
          uv run --no-dev python -m scripts.validation_images publish
          "$RUNNER_TEMP/tested-images" --release "$RUNNER_TEMP/validation-release"

      - name: Upload exact validation identities
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-release
          path: ${{ runner.temp }}/validation-release/
          if-no-files-found: error
          retention-days: 90
