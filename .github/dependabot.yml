version: 2
updates:
  # uv projects: the root lock and the standalone CLI build's own lock.
  - package-ecosystem: uv
    directories: ["/", "/packaging/standalone"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # Digest-pinned base images, and in packaging/runtime-pins the runtime images
  # that only Ansible and CI pin (#273). Each FROM names its tag, because an untagged
  # digest is tracked as `latest` (trixie, Debian-based NGINX). Python stays on
  # the 3.14 line that requires-python allows. uv moves together with the
  # setup-uv `version` pins, which Dependabot cannot update. The validation
  # edge carries a temporary brotli-libs layer; re-check it whenever the NGINX
  # digest moves.
  - package-ecosystem: docker
    directories: ["/", "/packaging/api", "/packaging/validation-edge", "/packaging/standalone", "/packaging/runtime-pins"]
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: library/python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: astral-sh/uv
    groups:
      # A cloudflared bump needs the other pins changed by hand (#273); keep it
      # out of the base-image PR so that one stays green. First match wins.
      runtime-pins:
        patterns: ["cloudflare/cloudflared"]
      base-images:
        patterns: ["*"]
